<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="favicon-title">
  <title id="favicon-title">云枢 OpsMind</title>
  <!-- 16/32px favicon：固定底板，不能依赖主题继承。底板 #1e1e2e + mark #89b4fa
       = 7.79:1；裸 #1a56c4 在深色标签栏只有 2.48:1、在中灰 #5a6070 只有 1.05:1，
       透明底描边会消失。几何：轴 8 / 弧 6 / hub r=8（轴宽 2×）。
       光学轴心 x=28：32px 下 +2px、16px 下 +1px，均落在整像素列。
       精确 16px 请用 favicon-16.svg（描边吸附像素）；本文件服务 sizes="any"。 -->
  <rect width="64" height="64" rx="14" fill="#1e1e2e" />
  <g transform="translate(4 0)">
    <g fill="none" stroke="#89b4fa" stroke-linecap="round">
      <path d="M24 8V56" stroke-width="8" />
      <path d="M36 16A20 20 0 0 1 36 48" stroke-width="6" />
    </g>
    <circle cx="24" cy="32" r="8" fill="#89b4fa" />
  </g>

</svg>
