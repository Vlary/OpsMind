      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取消后的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: 读取公开系统设置（六期）
      description: |
        只返回契约公开键（v1 仅 approval_mode——全局审批门限，契约 2.11 约定 1）；
        内部键（bootstrap.*、monitor.*）不暴露。settings['approval.mode'] 缺失时
        按 standard 兜底返回。monitor.collector 继续走 GET/PUT /api/monitor/collector。
        七期起明确：**主题偏好不属于本端点**——light/dark/system 三态存浏览器
        localStorage（键 opsmind.theme），理由是登录页首次绘制早于任何 API
        （本端点在鉴权组，未登录取不到），且纯展示偏好不应产生 settings.update
        审计；详见契约 8.3.12。禁止为本偏好扩展本响应。
      responses:
        '200':
          description: 设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [settings]
      operationId: updateSettings
      summary: 更新公开系统设置（六期）
      description: |
        写 settings['approval.mode']（JSON 字符串）。变更对后续新审批即时生效
        （已 pending 的审批不迁移、按创建时快照展示）。写审计 settings.update。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: 更新后的设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/term/sessions:
    post:
      tags: [terminal]
      operationId: createTerminalSession
      summary: 创建终端会话
      description: |
        为 server_id 打开堡垒机式交互终端。仅支持 SSH 通道的服务器（os=linux，
        或 os=windows 且 auth_method 为 password/private_key）；WinRM 认证的
        服务器无 PTY 语义，返回 400 `TERM_UNSUPPORTED`。同一服务器同时只允许
        一个活动会话（409 `TERM_SESSION_EXISTS`）；全局活动会话达到上限返回
        429 `TERM_SESSION_LIMIT`。创建即写审计 `session.start`（resource_type=
        terminal_session）。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalSessionCreate'
      responses:
        '201':
          description: 已创建；随 ws_url 建立 WebSocket 后开始传输
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [terminal]
      operationId: listTerminalSessions
      summary: 终端会话列表
      description: 按 created_at DESC, id DESC 返回，`status` 过滤可选（active|closed）。
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InteractiveSessionStatus'
        - name: server_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSessionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/term/sessions/{id}/ws:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [terminal]
      operationId: terminalSessionSocket
      summary: 终端 WebSocket 通道
      description: |
        升级为 WebSocket（子协议必须为 `opsmind-term-v1`，缺失或不匹配返回
        400 `TERM_WS_PROTOCOL`）。鉴权与 Origin 同 REST：升级前校验
        `opsmind_session` Cookie 与 Origin 精确匹配，失败分别 401/403。
        会话行必须为 active 且属于当前用户，否则 404/409。连接建立后服务端
        通过 SSH PTY 双向转发；仅输出流录制为 asciinema v2。空闲 10 分钟或
        时长满 8 小时服务端主动断开；任一方断开即关闭 PTY、封盘录制并写
        审计 `session.end` 与 `session.input_summary`。帧格式见
        x-websocket-events 与 docs/CONTRACT.md 第 11 节。
      responses:
        '101':
          description: 协议升级为 WebSocket（子协议 opsmind-term-v1）
          content:
            application/json:
              schema:
                type: string
          x-websocket-events:
            client_input:
              schema:
                $ref: '#/components/schemas/TermFrameInput'
            client_resize:
              schema:
                $ref: '#/components/schemas/TermFrameResize'
            server_output:
              schema:
                $ref: '#/components/schemas/TermFrameOutput'
            server_resized:
              schema:
                $ref: '#/components/schemas/TermFrameResized'
            server_error:
              schema:
                $ref: '#/components/schemas/TermFrameError'
            server_closed:
              schema:
                $ref: '#/components/schemas/TermFrameClosed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/term/recordings:
    get:
      tags: [terminal]
      operationId: listTerminalRecordings
      summary: 终端录制列表
      description: 返回有录制文件的已结束终端会话（status=closed 且 recording_file 非空），按 started_at DESC。
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 录制列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalRecordingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/term/recordings/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [terminal]
      operationId: downloadTerminalRecording
      summary: 下载终端录制
      description: |
        以 asciinema v2（.cast）下发会话输出流录制。id 为终端会话 ID；文件名
        `<id>.cast` 不可预测。会话不存在返回 404 `TERM_SESSION_NOT_FOUND`，
        无录制或文件缺失返回 404 `RECORDING_NOT_FOUND` / 502
        `RECORDING_UNAVAILABLE`。
      responses:
        '200':
          description: asciicast v2 文件
          content:
            application/x-asciicast:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/rdp/sessions:
    post:
      tags: [rdp]
      operationId: createRdpSession
      summary: 创建 RDP 会话
      description: |
        为 os=windows 的服务器打开 RDP 网关会话。分辨率在创建时固定（运行中
        不支持 resize）。服务器必须已保存密码凭据（auth_method=password/
        password_ntlm/password_basic），否则 400 `RDP_NO_CREDENTIALS`；非
        windows 服务器 400 `RDP_UNSUPPORTED`；guacd 未配置或不可达 503
        `GUACD_UNAVAILABLE`。同一服务器同时只允许一个活动会话；全局上限
        429。创建即写审计 `session.start`（resource_type=rdp_session）。
        服务器凭据在 Go 网关注入 guacd 握手，绝不进入浏览器。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RdpSessionCreate'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdpSessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [rdp]
      operationId: listRdpSessions
      summary: RDP 会话列表
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InteractiveSessionStatus'
        - name: server_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdpSessionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/rdp/sessions/{id}/ws:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [rdp]
      operationId: rdpSessionSocket
      summary: RDP WebSocket 通道（guacamole 协议透传）
      description: |
        升级为 WebSocket（无子协议要求，兼容 guacamole-common-js 的
        WebSocketTunnel）。鉴权与 Origin 同 REST。服务端连接 guacd（TCP
        4822），select rdp 后在握手 args 注入 hostname/port/username/
        password/security/ignore-cert/width/height/dpi/recording-name，随后
        与浏览器双向透传字节流；不解析 guacamole 指令语义。空闲 30 分钟或
        时长满 8 小时断开；断开即结束 guacd 连接并写审计 `session.end`。
      responses:
        '101':
          description: 协议升级为 WebSocket；载荷为 guacamole 协议（长度前缀指令流），Go 侧纯透传
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/rdp/recordings:
    get:
      tags: [rdp]
      operationId: listRdpRecordings
      summary: RDP 录制列表
      description: 返回有录制文件的已结束 RDP 会话（guacd 侧 recording-name 命中的 .guac 文件），按 started_at DESC。
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 录制列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdpRecordingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/rdp/recordings/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [rdp]
      operationId: downloadRdpRecording
      summary: 下载 RDP 录制
      description: |
        下发 guacd 原生 .guac 录制文件（application/octet-stream）；转码不在
        二期范围。文件名 `<id>.guac` 不可预测。
      responses:
        '200':
          description: guacamole 录制文件
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: opsmind_session
      description: 登录成功后由服务端设置的 HttpOnly 会话 Cookie。

  headers:
    XRequestID:
      description: 请求 ID；与错误体中的 request_id 一致。
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'

  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: 必须精确匹配允许的 Origin；缺失或不匹配返回 403。
      schema:
        type: string
        examples:
          - http://localhost:5173
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContainerIdPath:
      name: cid
      in: path
      required: true
      description: 容器 ID 或名称；必须匹配 ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: 参数校验失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或会话过期
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OriginForbidden:
      description: Origin 缺失或不匹配
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源冲突（重名、重复、状态不允许）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HostKeyChanged:
      description: SSH 主机密钥与已信任值不一致，命令未执行
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SqlNotReadOnly:
      description: SQL 非只读、包含多语句或被守卫拒绝
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 登录限流或流并发超限
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          description: 建议重试秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: 上游（SSH、数据库、LLM）失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: 上游超时
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 依赖组件（guacd）不可用或服务关闭中
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorCode:
      type: string
      description: 错误码。实现集中在 internal/apierr/codes.go。
      enum:
        - AUTH_REQUIRED
        - AUTH_INVALID
        - AUTH_RATE_LIMITED
        - ORIGIN_FORBIDDEN
        - VALIDATION_FAILED
        - NOT_FOUND
        - CONFLICT
        - INTERNAL
        - SERVICE_UNAVAILABLE
        - TOO_MANY_STREAMS
        - STREAM_ACTIVE
        - CONVERSATION_NOT_FOUND
        - CONVERSATION_MODEL_LOCKED
        - NO_PROVIDER_CONFIGURED
        - PROVIDER_NOT_FOUND
        - PROVIDER_TEST_FAILED
        - PROVIDER_MODELS_FAILED
        - SERVER_NOT_FOUND
        - SERVER_TEST_FAILED
        - SSH_HOST_KEY_CHANGED
        - SSH_TIMEOUT
        - SSH_EXEC_FAILED
        - COMMAND_TOO_LARGE
        - COMMAND_INVALID
        - COMMAND_FORBIDDEN
        - DATABASE_NOT_FOUND
        - DATABASE_TEST_FAILED
        - SQL_NOT_READONLY
        - SQL_TIMEOUT
        - SQL_QUERY_FAILED
        - APPROVAL_NOT_FOUND
        - APPROVAL_NOT_PENDING
        - APPROVAL_DENIED
        - APPROVAL_TIMEOUT
        - APPROVAL_CANCELLED
        - TOOL_NOT_FOUND
        - TOOL_ARGS_INVALID
        - AGENT_MAX_ITERATIONS
        - LLM_UPSTREAM_ERROR
        - LLM_TIMEOUT
        - LLM_OUTPUT_TRUNCATED
        - LLM_STREAM_ERROR
        - AUDIT_WRITE_FAILED
        - STREAM_TIMEOUT
        - SERVER_SHUTTING_DOWN
        - APPROVAL_STREAM_CANCELLED
        - CLIENT_DISCONNECTED
        - TERM_SESSION_NOT_FOUND
        - TERM_SESSION_EXISTS
        - TERM_SESSION_LIMIT
        - TERM_CONNECT_FAILED
        - TERM_UNSUPPORTED
        - TERM_WS_PROTOCOL
        - RECORDING_NOT_FOUND
        - RECORDING_UNAVAILABLE
        - RDP_SESSION_NOT_FOUND
        - RDP_SESSION_EXISTS
        - RDP_SESSION_LIMIT
        - RDP_CONNECT_FAILED
        - RDP_UNSUPPORTED
        - RDP_NO_CREDENTIALS
        - GUACD_UNAVAILABLE
        - NETCLI_LOGIN_FAILED
        - NETCLI_EXEC_FAILED
        - CONTAINER_UNSUPPORTED
        - CONTAINER_NOT_FOUND
        - CONTAINER_CLI_FAILED
    MaybeErrorCode:
      description: 错误码；空字符串表示无错误。
      oneOf:
        - $ref: '#/components/schemas/ErrorCode'
        - type: string
          const: ''
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 英文短句；前端按 code 显示中文。
          minLength: 1
          maxLength: 500
        request_id:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        details:
          type: object
          additionalProperties: true
          description: 非敏感结构化细节；可省略。
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    RiskLevel:
      type: string
      enum: [safe, needs_approval, forbidden]
    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, expired]
    AuthMethod:
      type: string
      description: 'linux：password|private_key（SSH）。windows：password|private_key（Windows OpenSSH，走 SSH）或 password_ntlm|password_basic（WinRM，端口 winrm_port）。network_device（三期）：仅 password（SSH 或 Telnet）。'
      enum: [password, private_key, password_ntlm, password_basic]
    DeviceKind:
      type: string
      description: 资产形态（三期）：server=主机（linux/windows）；network_device=网络设备（交换机/路由器/防火墙，CLI 行协议）。
      enum: [server, network_device]
    NetdevBrand:
      type: string
      description: 网络设备厂商（三期），决定 netcli profile 与风险分册；仅 device_kind=network_device 时非空。
      enum: [cisco, huawei, h3c, junos, generic]
    AccessProto:
      type: string
      description: 网络设备接入协议（三期）。telnet 为明文传输，创建/更新必须显式携带 confirm_telnet_cleartext=true。
      enum: [ssh, telnet]
    DatabaseEngine:
      type: string
      enum: [postgres, mysql, sqlite, mssql, redis, mongodb]
    TargetOS:
      type: string
      description: server 类资产的操作系统；network 仅用于 device_kind=network_device（网络设备风险分册路由）。
      enum: [linux, windows, network]
    ProviderKind:
      type: string
      enum: [openai_compatible, anthropic]
    ProviderPresetName:
      type: string
      enum: [openai, deepseek, dashscope, moonshot, zhipu, anthropic, gemini, ollama, custom]
    SSLMode:
      type: string
      enum: [disable, prefer, require, verify-ca, verify-full]
    MessageRole:
      type: string
      enum: [user, assistant]
    MessageStatus:
      type: string
      enum: [complete, error]
    ToolCallStatus:
      type: string
      enum: [started, awaiting_approval, succeeded, failed, denied, expired, awaiting_user]

    User:
      type: object
      required: [id, username, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          const: admin
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
    PasswordChangeRequest:
      type: object
      required: [old_password, new_password]
      additionalProperties: false
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 1
          maxLength: 72
          description: 长度按字节计（bcrypt 明文上限 72 字节）。
    LoginResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    Server:
      type: object
      required:
        - id
        - name
        - device_kind
        - os
        - netdev_brand
        - access_proto
        - host
        - port
        - winrm_port
        - username
        - auth_method
        - tags
        - auto_exec_enabled
        - has_password
        - has_private_key
        - has_enable_secret
        - container_runtime
        - host_key_fingerprint
        - host_key_verified_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        device_kind:
          $ref: '#/components/schemas/DeviceKind'
        os:
          $ref: '#/components/schemas/TargetOS'
          description: device_kind=server 时 linux|windows；network_device 时恒 network。
        netdev_brand:
          $ref: '#/components/schemas/NetdevBrand'
          description: 仅 network_device 非空；server 恒空串。
        access_proto:
          $ref: '#/components/schemas/AccessProto'
          description: 仅 network_device 有意义（ssh|telnet）；server 恒 ssh。
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: SSH 端口（linux/windows 的 OpenSSH 与网络设备 SSH/Telnet 共用）。
        winrm_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: WinRM 端口；仅 auth_method 为 password_ntlm/password_basic 时使用，其余情况仍返回该字段但不参与连接。
        username:
          type: string
          minLength: 1
          maxLength: 100
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        tags:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 32
        auto_exec_enabled:
          type: boolean
        has_password:
          type: boolean
        has_private_key:
          type: boolean
        has_enable_secret:
          type: boolean
          description: 网络设备 enable/super 特权密码是否已配置；server 恒 false。
        container_runtime:
          $ref: '#/components/schemas/ContainerRuntime'
        host_key_fingerprint:
          type: string
          description: 空字符串表示尚未 TOFU 记录；Telnet 接入恒空串（无主机密钥语义）。
        host_key_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Server'
    ServerCreate:
      type: object
      required: [name, host, username, auth_method]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        device_kind:
          $ref: '#/components/schemas/DeviceKind'
          default: server
        os:
          $ref: '#/components/schemas/TargetOS'
          default: linux
        netdev_brand:
          anyOf:
            - $ref: '#/components/schemas/NetdevBrand'
            - type: string
              const: ''
          description: 仅 device_kind=network_device 时必填。
        access_proto:
          $ref: '#/components/schemas/AccessProto'
          default: ssh
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 22
        winrm_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 5985
        username:
          type: string
          minLength: 1
          maxLength: 100
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: auth_method=password/password_ntlm/password_basic 时必填（NTLM/Basic 存入同一加密字段）；network_device 恒用 password 登录。
        private_key:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
        passphrase:
          type: string
          maxLength: 4096
          writeOnly: true
        enable_secret:
          type: string
          maxLength: 4096
          writeOnly: true
          description: 仅 network_device：enable/super 特权密码，可选（空=未配置；空串与缺省等价）。
        confirm_telnet_cleartext:
          type: boolean
          default: false
          writeOnly: true
          description: access_proto=telnet 时必须显式传 true（明文风险确认）；缺失/false 返回 400。
        tags:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 32
        auto_exec_enabled:
          type: boolean
          default: false
      allOf:
        - if:
            properties:
              device_kind:
                const: network_device
            required: [device_kind]
          then:
            required: [netdev_brand, password]
            properties:
              os:
                const: network
              auth_method:
                const: password
              private_key:
                const: ''
        - if:
            properties:
              device_kind:
                const: network_device
              access_proto:
                const: telnet
            required: [device_kind, access_proto]
          then:
            required: [confirm_telnet_cleartext]
            properties:
              confirm_telnet_cleartext:
                const: true
        - if:
            properties:
              os:
                const: linux
            required: [os]
          then:
            properties:
              auth_method:
                enum: [password, private_key]
        - if:
            properties:
              auth_method:
                const: password
            required: [auth_method]
          then:
            required: [password]
            not:
              required: [private_key]
        - if:
            properties:
              auth_method:
                const: password_ntlm
            required: [auth_method]
          then:
            required: [os]
            properties:
              os:
                const: windows
              password:
                minLength: 1
            not:
              required: [private_key]
        - if:
            properties:
              auth_method:
                const: password_basic
            required: [auth_method]
          then:
            required: [os]
            properties:
              os:
                const: windows
              password:
                minLength: 1
            not:
              required: [private_key]
        - if:
            properties:
              auth_method:
                const: private_key
            required: [auth_method]
          then:
            required: [private_key]
            not:
              required: [password]
    ServerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        device_kind:
          $ref: '#/components/schemas/DeviceKind'
        os:
          $ref: '#/components/schemas/TargetOS'
        netdev_brand:
          anyOf:
            - $ref: '#/components/schemas/NetdevBrand'
            - type: string
              const: ''
        access_proto:
          $ref: '#/components/schemas/AccessProto'
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        winrm_port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 100
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        private_key:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
        passphrase:
          type: string
          maxLength: 4096
          writeOnly: true
        enable_secret:
          type: string
          maxLength: 4096
          writeOnly: true
          description: 仅 network_device：提供即替换；空字符串表示清空 enable 密码。
        confirm_telnet_cleartext:
          type: boolean
          default: false
          writeOnly: true
          description: 更新使 access_proto 生效为 telnet 时必须显式传 true。
        tags:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 32
        auto_exec_enabled:
          type: boolean
      allOf:
        - if:
            properties:
              access_proto:
                const: telnet
            required: [access_proto]
          then:
            required: [confirm_telnet_cleartext]
            properties:
              confirm_telnet_cleartext:
                const: true
          description: 近似表达；跨请求终态组合（存量 telnet + 本次改密码）由服务端按契约 2.6 强制。
        - if:
            anyOf:
              - required: [password]
              - required: [private_key]
              - required: [passphrase]
          then:
            required: [auth_method]
        - if:
            required: [auth_method]
            properties:
              auth_method:
                const: password
          then:
            required: [password]
            not:
              required: [private_key]
        - if:
            required: [auth_method]
            properties:
              auth_method:
                enum: [password_ntlm, password_basic]
          then:
            required: [os, password]
            properties:
              os:
                const: windows
            not:
              required: [private_key]
        - if:
            required: [auth_method]
            properties:
              auth_method:
                const: private_key
          then:
            required: [private_key]
            not:
              required: [password]
    ServerTestResult:
      type: object
      required: [ok, latency_ms, fingerprint, first_seen, server_version]
      properties:
        ok:
          type: boolean
          const: true
        cleartext_warning:
          type: string
          description: Telnet 接入的网络设备返回明文风险告警（契约 2.6「UI 必须显示明文风险提示」）；其余通道不下发。
        latency_ms:
          type: integer
          minimum: 0
        fingerprint:
          type: string
          description: 形如 SHA256:...；Telnet 接入的网络设备恒空串（无主机密钥语义）。
        first_seen:
          type: boolean
          description: true 表示首次信任并已记录主机密钥。
        server_version:
          type: string

    Database:
      type: object
      required:
        - id
        - name
        - engine
        - host
        - port
        - database_name
        - username
        - sqlite_path
        - instance_name
        - redis_db
        - auth_db
        - ssl_mode
        - has_password
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        engine:
          $ref: '#/components/schemas/DatabaseEngine'
        host:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
        database_name:
          type: string
          description: mssql/mongodb 必填；redis 固定空串（redis 用整数 redis_db）。
        username:
          type: string
          description: mssql 必填；mongodb 与 password 成对（同空=无认证）；redis 可空（Redis 6 ACL 用户，默认 default 可省略）。
        sqlite_path:
          type: string
        instance_name:
          type: string
          description: 仅 mssql：SQL Server 命名实例名；非空时 port 必须为 0（经 SQL Server Browser 解析），为空时 port 必填直连。其他 engine 固定空串。
        redis_db:
          type: integer
          minimum: 0
          maximum: 1023
          description: 仅 redis：逻辑库编号；其他 engine 固定 0。
        auth_db:
          type: string
          maxLength: 100
          description: 仅 mongodb：认证库（AuthSource）；空串表示驱动默认 admin。其他 engine 固定空串。
        ssl_mode:
          $ref: '#/components/schemas/SSLMode'
        has_password:
          type: boolean
          description: mssql 恒为 true；mongodb 表示是否配置了认证密码（与 username 成对）；redis 表示是否配置了 AUTH 密码。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DatabaseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Database'
    DatabaseCreate:
      type: object
      required: [name, engine]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        engine:
          $ref: '#/components/schemas/DatabaseEngine'
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 0
          maximum: 65535
        database_name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 4096
          writeOnly: true
          description: mssql 必填；mongodb 与 username 成对可选（无认证则都不提供）；redis 可选（requirepass/ACL 密码）；postgres/mysql 同一期。
        sqlite_path:
          type: string
          maxLength: 4096
          description: SQLite 绝对路径；必须以 / 开头，且服务端可读。
        instance_name:
          type: string
          maxLength: 100
          description: 仅 mssql；与 port 互斥（instance 非空时 port 必须为 0）。
        redis_db:
          type: integer
          minimum: 0
          maximum: 1023
        auth_db:
          type: string
          maxLength: 100
          description: 仅 mongodb：认证库（AuthSource）；缺省空串 = admin。
        ssl_mode:
          $ref: '#/components/schemas/SSLMode'
      allOf:
        - if:
            properties:
              engine:
                const: sqlite
            required: [engine]
          then:
            required: [sqlite_path]
            properties:
              host:
                const: ''
              port:
                const: 0
              database_name:
                const: ''
              username:
                const: ''
        - if:
            properties:
              engine:
                enum: [postgres, mysql]
            required: [engine]
          then:
            required: [host, port, database_name, username]
            properties:
              sqlite_path:
                const: ''
        - if:
            properties:
              engine:
                const: mssql
            required: [engine]
          then:
            required: [host, database_name, username, password]
            properties:
              sqlite_path:
                const: ''
        - if:
            properties:
              engine:
                const: redis
            required: [engine]
          then:
            required: [host, port]
            properties:
              database_name:
                const: ''
              sqlite_path:
                const: ''
        - if:
            properties:
              engine:
                const: mongodb
            required: [engine]
          then:
            required: [host, database_name]
            properties:
              port:
                default: 27017
                minimum: 1
                maximum: 65535
              sqlite_path:
                const: ''
              instance_name:
                const: ''
              redis_db:
                const: 0
    DatabaseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 0
          maximum: 65535
        database_name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 4096
          writeOnly: true
          description: 提供时替换；空字符串表示清空密码。mongodb 与 username 成对（清空须两者同时清）。
        sqlite_path:
          type: string
          maxLength: 4096
        instance_name:
          type: string
          maxLength: 100
        redis_db:
          type: integer
          minimum: 0
          maximum: 1023
        auth_db:
          type: string
          maxLength: 100
        ssl_mode:
          $ref: '#/components/schemas/SSLMode'
    DatabaseTestResult:
      type: object
      required: [ok, latency_ms, server_version]
      properties:
        ok:
          type: boolean
          const: true
        latency_ms:
          type: integer
          minimum: 0
        server_version:
          type: string
    SqlQueryRequest:
      type: object
      required: [sql]
      additionalProperties: false
      properties:
        sql:
          type: string
          minLength: 1
          maxLength: 65536
    SqlColumn:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
    SqlQueryResult:
      type: object
      required: [columns, rows, row_count, truncated, duration_ms]
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/SqlColumn'
        rows:
          type: array
          items:
            type: array
            items: {}
        row_count:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        duration_ms:
          type: integer
          minimum: 0

    Provider:
      type: object
      required:
        - id
        - name
        - preset
        - kind
        - base_url
        - api_key_masked
        - has_api_key
        - default_model
        - models
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        preset:
          $ref: '#/components/schemas/ProviderPresetName'
        kind:
          $ref: '#/components/schemas/ProviderKind'
        base_url:
          type: string
          minLength: 1
          maxLength: 2048
        api_key_masked:
          type: string
          description: 只有 key 存在时为 `****` + 末 4 位；绝不返回明文。
        has_api_key:
          type: boolean
        default_model:
          type: string
          minLength: 1
        models:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
    ProviderCreate:
      type: object
      required: [name, preset, kind, base_url, default_model]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        preset:
          $ref: '#/components/schemas/ProviderPresetName'
        kind:
          $ref: '#/components/schemas/ProviderKind'
        base_url:
          type: string
          minLength: 1
          maxLength: 2048
          description: http/https，去掉尾部斜杠后保存；不得包含 userinfo 或 fragment。
        api_key:
          type: string
          maxLength: 8192
          writeOnly: true
        default_model:
          type: string
          minLength: 1
          maxLength: 255
        models:
          type: array
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 255
      allOf:
        - if:
            properties:
              preset:
                not:
                  enum: [ollama, custom]
            required: [preset]
          then:
            required: [api_key]
        - if:
            properties:
              preset:
                const: anthropic
            required: [preset]
          then:
            properties:
              kind:
                const: anthropic
        - if:
            properties:
              preset:
                not:
                  const: anthropic
            required: [preset]
          then:
            properties:
              kind:
                const: openai_compatible
    ProviderUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      not:
        required: [api_key, clear_api_key]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        preset:
          $ref: '#/components/schemas/ProviderPresetName'
        kind:
          $ref: '#/components/schemas/ProviderKind'
        base_url:
          type: string
          minLength: 1
          maxLength: 2048
        api_key:
          type: string
          maxLength: 8192
          writeOnly: true
        clear_api_key:
          type: boolean
          default: false
        default_model:
          type: string
          minLength: 1
          maxLength: 255
        models:
          type: array
          maxItems: 500
          items:
            type: string
            minLength: 1
            maxLength: 255
    ProviderPreset:
      type: object
      required: [preset, name, kind, base_url, suggested_models, api_key_required]
      properties:
        preset:
          $ref: '#/components/schemas/ProviderPresetName'
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ProviderKind'
        base_url:
          type: string
        suggested_models:
          type: array
          items:
            type: string
        api_key_required:
          type: boolean
    ProviderPresetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProviderPreset'
    ProviderTestResult:
      type: object
      required: [ok, latency_ms, model_count]
      properties:
        ok:
          type: boolean
          const: true
        latency_ms:
          type: integer
          minimum: 0
        model_count:
          type: integer
          minimum: 0
    ProviderModels:
      type: object
      required: [models, refreshed_at]
      properties:
        models:
          type: array
          items:
            type: string
        refreshed_at:
          type: string
          format: date-time

    Conversation:
      type: object
      required:
        - id
        - title
        - provider_id
        - model
        - created_at
        - updated_at
        - last_message_at
        - approval_mode
        - effective_approval_mode
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        provider_id:
          type: [string, 'null']
          format: uuid
        model:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
        approval_mode:
          oneOf:
            - $ref: '#/components/schemas/ApprovalMode'
            - type: 'null'
          description: 会话级审批门限覆盖（六期）；null=跟随全局。
        effective_approval_mode:
          $ref: '#/components/schemas/ApprovalMode'
          description: 有效门限（会话覆盖 > 全局缺省 standard；handler 装配的派生字段，不落库）。
    ConversationList:
      type: object
      required: [items, has_more, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        has_more:
          type: boolean
        next_cursor:
          type: [object, 'null']
          description: 下一页游标（本页末条排序键）；has_more=false 时为 null。
          required: [last_message_at, id]
          properties:
            last_message_at:
              type: string
              format: date-time
            id:
              type: string
              format: uuid
    ConversationCreate:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    ConversationUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        approval_mode:
          oneOf:
            - $ref: '#/components/schemas/ApprovalMode'
            - type: 'null'
          description: 六期：会话级审批门限覆盖；null=清除覆盖（跟随全局）。与 title 至少携带一项。

    Message:
      type: object
      required:
        - id
        - seq
        - conversation_id
        - turn_id
        - role
        - content
        - reasoning
        - reasoning_duration_ms
        - status
        - error_code
        - model
        - prompt_tokens
        - completion_tokens
        - created_at
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          minimum: 1
        conversation_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MessageRole'
        content:
          type: string
        reasoning:
          type: string
        reasoning_duration_ms:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            本轮 reasoning 首/尾 SSE delta 的服务端毫秒时间差（六期打磨）。
            null = 无 reasoning 或 00009 之前的旧消息无计时数据；
            0 = 有 reasoning 但不足 1ms（前端显示「深度思考 · 耗时 0s」）。
        status:
          $ref: '#/components/schemas/MessageStatus'
        error_code:
          $ref: '#/components/schemas/MaybeErrorCode'
          description: 空字符串表示无错误。
        model:
          type: string
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    MessagePage:
      type: object
      required: [items, has_more, next_before_seq]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        has_more:
          type: boolean
        next_before_seq:
          type: [integer, 'null']
          format: int64

    ToolCall:
      type: object
      required:
        - id
        - seq
        - conversation_id
        - turn_id
        - provider_call_id
        - name
        - arguments
        - result
        - risk_level
        - status
        - error_code
        - error_message
        - approval_mode
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          minimum: 1
        conversation_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
        provider_call_id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        result:
          type: [object, 'null']
          additionalProperties: true
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        status:
          $ref: '#/components/schemas/ToolCallStatus'
        error_code:
          $ref: '#/components/schemas/MaybeErrorCode'
          description: |
            空字符串表示无错误。六期打磨 sprint 3：审批因回答流中断被连带取消的
            调用落 `APPROVAL_CANCELLED`（status=expired），不再永久停在
            awaiting_approval——与同会话审批卡（expired + note=stream_cancelled
            显示为「已取消」）口径一致。
        error_message:
          type: string
          description: 失败的底层原因（与 SSE tool_result.error.message 一致）；空字符串表示无错误或无消息。
        approval_mode:
          type: string
          enum: ['', all, standard, high, none]
          description: |
            判定时的有效审批门限快照（六期打磨 sprint 1，tool_calls.approval_mode，
            迁移 00010）。仅命令执行类工具（ssh_exec / container_action /
            batch_execute）记录；其余工具与 00010 之前的旧行为空串（前端不渲染
            门限徽标）。刷新/重新进入会话后工具卡的「在 <mode> 门限下执行」徽标
            据此持久化显示，与 SSE tool_result.approval_mode 同源。
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    ToolCallPage:
      type: object
      required: [items, has_more, next_before_seq]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        has_more:
          type: boolean
        next_before_seq:
          type: [integer, 'null']
          format: int64

    ApprovalMode:
      type: string
      enum: [all, standard, high, none]
      description: |
        审批门限四档（六期契约 2.11 约定 1）：all=全部命令审批（含只读）；
        standard=危险命令审批、只读免审（一至五期现行默认）；high=仅高危审批
        （warning 级 needs_approval 也免审）；none=免审批、全部自动执行（仍必须
        落审计；auto_exec_enabled=false 为服务器级硬保护——非只读命令一律审批）。

    ReplayStep:
      type: object
      required: [seq, timestamp, kind]
      additionalProperties: false
      description: |
        回放单步（六期）。除 seq/timestamp/kind 外字段按 kind 可空：字段全集写死，
        未用字段为 null（不缺省键）。各 kind 的字段契约：
        user_message/assistant_text/reasoning→message_id+content（reasoning 另带
        reasoning_duration_ms；user_message 的 content 已剥离 ChatPage 的
        `<!--opsmind-context … -->` 内部上下文前缀）；
        tool_call→tool_call_id+name+arguments+risk_level+status+error_code+
        approval_mode；approval→approval_id+tool_call_id+source+server_name+command+
        original_command+risk_level+edited_risk_level+status；execution→
        tool_call_id+name+command+status+exit_code+output+error_code+duration_ms
        （失败且无 result 的调用也生成 status=failed + error_code 的 execution 步，
        exit_code=-1、output 为空串）。
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: 重建后统一重编的全局序（1..N，升序即时间序）。
        timestamp:
          type: string
          format: date-time
        kind:
          type: string
          enum: [user_message, assistant_text, reasoning, tool_call, approval, execution]
        message_id:
          type: [string, 'null']
          format: uuid
        tool_call_id:
          type: [string, 'null']
          format: uuid
        approval_id:
          type: [string, 'null']
          format: uuid
        name:
          type: [string, 'null']
          description: 工具名（tool_call/execution）。
        source:
          type: [string, 'null']
          enum: [chat, console, batch, 'null']
          description: 审批发起来源（approval）。
        server_name:
          type: [string, 'null']
          description: 审批目标服务器名（approval；服务器删除后空串）。
        content:
          type: [string, 'null']
          description: 文本内容（user_message/assistant_text/reasoning）。
        reasoning_duration_ms:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            该轮 reasoning 服务端计时毫秒（六期打磨 sprint 1，仅 reasoning 步）：
            取自 messages.reasoning_duration_ms；null = 无计时数据（00009 之前的
            旧消息或非 reasoning 步）。回放播放器的「深度思考 · 耗时 Ns」据此
            与消息页保持一致。
        command:
          type: [string, 'null']
          description: 实际执行命令（approval/execution；审批被改写时为改写后命令）。
        original_command:
          type: [string, 'null']
          description: 审批原命令（approval；仅被改写时非 null）。
        arguments:
          type: [object, 'null']
          additionalProperties: true
          description: 工具调用参数（tool_call）。
        risk_level:
          type: [string, 'null']
          enum: [safe, needs_approval, forbidden, 'null']
          description: 风险级别（tool_call/approval；approval 为原始命令级别）。
        edited_risk_level:
          type: [string, 'null']
          enum: [safe, needs_approval, 'null']
          description: 改写后命令级别（approval；未改写为 null）。
        status:
          type: [string, 'null']
          description: 状态（tool_call 的 ToolCallStatus / approval 的 ApprovalStatus / execution 为 succeeded|failed）。
        exit_code:
          type: [integer, 'null']
          description: 退出码（execution；通道失败 -1）。
        output:
          type: [string, 'null']
          description: 执行输出（execution；tool_calls.result 持久化值，已受 64KB 截断）。
        error_code:
          type: [string, 'null']
          description: |
            错误码（tool_call/execution）。六期打磨 sprint 2 起 tool_call 步也
            填充（openapi 早已声明但此前恒 null）：失败的调用可直接看出
            SSH_EXEC_FAILED 等原因；execution 步同样携带。
        approval_mode:
          type: [string, 'null']
          enum: [all, standard, high, none, 'null']
          description: |
            判定时的有效审批门限快照（tool_call 步；取自 tool_calls.approval_mode，
            六期打磨 sprint 2）。回放据此复用聊天侧的免审批判定：none/high 档下
            needs_approval 命令未建审批且已执行时显示「高风险 · 免审批执行」而不是
            「需审批」。null=非命令执行类工具，或 00010 之前的旧行未记录。
        duration_ms:
          type: [integer, 'null']
          minimum: 0
          description: 执行耗时毫秒（execution）。

    ReplayResponse:
      type: object
      required: [conversation_id, steps, truncated, truncated_reason]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          format: uuid
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReplayStep'
          maxItems: 20000
        truncated:
          type: boolean
          description: 有步骤/审批被丢弃时为 true（11 节防 OOM）；原因见 truncated_reason。
        truncated_reason:
          type: string
          enum: ['', steps, approvals]
          description: |
            截断原因（六期打磨 sprint 4）。`''`=未截断；`steps`=步数超 20000 丢弃最旧；
            `approvals`=单状态审批满 200 条（approvals.List 无游标，4×200=800 上限），
            更早审批未纳入回放。两种来源此前共用 truncated 标志，前端文案硬编码
            「超出 20000 步上限」，给只有 200 步的会话显示 20000 上限。

    ChatRequest:
      type: object
      required: [conversation_id, content]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 16000
        provider_id:
          type: string
          format: uuid
          description: 省略时使用会话已绑定供应商，其次第一个创建的供应商。
        model:
          type: string
          minLength: 1
          maxLength: 255
          description: 省略时使用会话已绑定模型或供应商默认模型。

    Approval:
      type: object
      required:
        - id
        - conversation_id
        - tool_call_id
        - source
        - server_id
        - server_name
        - command
        - risk_level
        - reason
        - status
        - approval_mode
        - requested_at
        - expires_at
        - decided_at
        - decided_by
        - note
        - edited_command
        - edited_risk_level
        - edited_rule_id
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: [string, 'null']
          format: uuid
          description: console/batch 审批（source=console|batch）为 null；chat 审批恒非 null。
        tool_call_id:
          type: [string, 'null']
          format: uuid
          description: console/batch 审批为 null；chat 审批恒非 null。
        source:
          type: string
          enum: [chat, console, batch]
          description: 审批发起来源（四期 console、五期 batch；历史数据等价 chat）。
        server_id:
          type: [string, 'null']
          format: uuid
        server_name:
          type: string
        command:
          type: string
        risk_level:
          type: string
          enum: [safe, needs_approval]
        rule_id:
          type: string
          description: 命中的风险规则 ID（如 RM_PROTECTED、FILE_WRITE）；历史数据可能为空串。
        reason:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        approval_mode:
          $ref: '#/components/schemas/ApprovalMode'
          description: 创建审批时的有效门限快照（六期 00008 起；历史行为 standard）。
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by:
          type: [string, 'null']
          format: uuid
        note:
          type: string
          maxLength: 500
        edited_command:
          type: string
          maxLength: 2000
          description: 用户改写后的命令（六期）；空串=未改写。执行（console/batch decide 或 chat 等待方）使用本字段非空时的值。
        edited_risk_level:
          type: string
          enum: ['', safe, needs_approval]
          description: 改写后命令的重新分类级别（六期）；空串=未改写。改写后 forbidden 在 decide 即被 403 拒绝，不落库。
        edited_rule_id:
          type: string
          description: 改写后命令命中的风险规则 ID（六期）；未改写为空串。
    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
    ApprovalDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, deny]
        note:
          type: string
          maxLength: 500
        edited_command:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            六期：批准时改写命令（可选）。仅 decision=approve 时合法（deny 携带本字段
            返回 400）；禁止 NUL；服务端按审批目标重新 risk.Classify——改写后
            forbidden 返回 403 COMMAND_FORBIDDEN 且审批保持 pending。

    AuditLog:
      type: object
      required:
        - id
        - created_at
        - actor_type
        - actor_id
        - actor_name
        - action
        - resource_type
        - resource_id
        - request_id
        - conversation_id
        - server_id
        - ip
        - detail
        - prev_hash
        - hash
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        actor_type:
          type: string
          enum: [user, system, model]
        actor_id:
          type: string
        actor_name:
          description: 操作者用户名；仅 actor_type=user 且能匹配到用户时非空，否则 null。
          type: [string, 'null']
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        request_id:
          type: string
        conversation_id:
          type: [string, 'null']
          format: uuid
        server_id:
          type: [string, 'null']
          format: uuid
        ip:
          type: string
        detail:
          type: object
          additionalProperties: true
        prev_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    AuditPage:
      type: object
      required: [items, has_more, next_before_id]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditLog'
        has_more:
          type: boolean
        next_before_id:
          type: [integer, 'null']
          format: int64

    ContainerRuntime:
      type: string
      description: 容器运行时探测结果（四期）。空串=未探测（network_device 恒空串）；containerd 仅探测展示，容器管理面不支持。
      enum: ['', none, docker, podman, containerd]
    Container:
      type: object
      required: [id, name, image, state, status, ports, created]
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        state:
          type: string
          description: running|exited|paused|created|...（运行时原值）
        status:
          type: string
          description: 人类可读状态原文（如 "Up 2 hours (healthy)"）。
        ports:
          type: array
          items:
            type: string
          description: 发布串原样（如 "0.0.0.0:5432->5432/tcp"）；无则空数组。
        created:
          type: string
          description: RFC3339；无法可靠解析时为空串（podman 列表）。
    ContainerMount:
      type: object
      required: [source, destination, rw]
      properties:
        source:
          type: string
        destination:
          type: string
        rw:
          type: boolean
    ContainerDetail:
      type: object
      required: [id, name, image, state, status, ports, created, exit_code, pid, started_at, finished_at, health_status, mounts]
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        state:
          type: string
        status:
          type: string
        ports:
          type: array
          items:
            type: string
        created:
          type: string
        exit_code:
          type: integer
        pid:
          type: integer
        started_at:
          type: string
          description: RFC3339；未启动为空串。
        finished_at:
          type: string
          description: RFC3339；未停止为空串。
        health_status:
          type: string
          description: healthy|unhealthy|starting|...；无健康检查块为空串。
        mounts:
          type: array
          items:
            $ref: '#/components/schemas/ContainerMount'
    ContainerListResponse:
      type: object
      required: [runtime, items]
      properties:
        runtime:
          $ref: '#/components/schemas/ContainerRuntime'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Container'
    ContainerImage:
      type: object
      required: [repo, tag, size_bytes, created]
      properties:
        repo:
          type: string
          description: '<none> 占位原样保留。'
        tag:
          type: string
          description: '<none> 占位原样保留。'
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: 字节数；docker 人类可读串按 1000 进制解析，解析失败为 0。
        created:
          type: string
          description: RFC3339；无法解析时为空串。
    ImageListResponse:
      type: object
      required: [runtime, items]
      properties:
        runtime:
          $ref: '#/components/schemas/ContainerRuntime'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContainerImage'
    ContainerActionRequest:
      type: object
      required: [action]
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [start, stop, restart]
    ContainerActionResponse:
      type: object
      required: [approval, execution]
      description: 六期起统一 wrapper：需审批时 approval 非 null（execution=null）；门限判定直执行时 execution 非 null（approval=null）。四期「恒建审批」的裸 Approval 形态废弃。
      properties:
        approval:
          oneOf:
            - $ref: '#/components/schemas/Approval'
            - type: 'null'
        execution:
          oneOf:
            - $ref: '#/components/schemas/ApprovalExecution'
            - type: 'null'
    ContainerLogsResponse:
      type: object
      required: [server_id, container_id, tail, output, truncated]
      properties:
        server_id:
          type: string
          format: uuid
        container_id:
          type: string
        tail:
          type: integer
          minimum: 1
          maximum: 1000
        output:
          type: string
          description: stdout+stderr 合并原文（通道已合并）；上限 256KB。
        truncated:
          type: boolean
    ApprovalExecution:
      type: object
      required: [exit_code, output, truncated, duration_ms]
      properties:
        exit_code:
          type: integer
          description: 通道执行失败（命令未到达/连接错误）时为 -1。
        output:
          type: string
        truncated:
          type: boolean
        duration_ms:
          type: integer
          minimum: 0
        error_code:
          type: string
          description: 通道/执行失败时的错误码（如 SSH_EXEC_FAILED）；成功时缺省。
