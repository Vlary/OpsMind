openapi: 3.1.0
info:
  title: 云枢 OpsMind API
  version: 1.0.0
  description: |
    云枢 OpsMind 单管理员 AI 运维控制台 API。

    - 除 `POST /api/auth/login` 与 `GET /healthz` 外，所有端点要求 `opsmind_session` Cookie。
    - 所有非 GET/HEAD 的 `/api/*` 请求必须携带与允许列表精确匹配的 `Origin` 头；缺失或不匹配返回 `403 ORIGIN_FORBIDDEN`。
    - 成功响应为 JSON；失败统一为 `{"error":{"code","message","request_id","details"?}}`。
    - `/api/chat` 成功时返回 `text/event-stream`，不使用压缩，事件格式见 `x-sse-events` 与 `docs/CONTRACT.md` 第 6 节。
    - 密钥字段只写不读：请求可包含 `password|private_key|passphrase|api_key`，任何响应都不会包含明文或密文。
  contact:
    name: 云枢 OpsMind
  license:
    name: Proprietary
servers:
  - url: /
    description: 同源部署
security:
  - cookieAuth: []
tags:
  - name: auth
    description: 登录、登出、当前用户
  - name: servers
    description: SSH 服务器资产
  - name: databases
    description: 外部数据库与只读查询
  - name: providers
    description: 大模型供应商
  - name: conversations
    description: 会话、消息、工具调用
  - name: chat
    description: 对话流
  - name: approvals
    description: 命令审批
  - name: audit
    description: 只追加审计日志
  - name: ops
    description: 运维辅助
  - name: monitor
    description: 监控指标采集与仪表盘（五期）
  - name: alerts
    description: 告警规则、事件与通知渠道（五期）
  - name: diagnosis
    description: AI 自诊断会话（五期）
  - name: inspection
    description: 定时巡检任务与报告（五期）
  - name: batch
    description: 批量操作任务（五期）
  - name: settings
    description: 系统设置（六期：审批门限）
  - name: terminal
    description: 堡垒机式终端会话与回放
  - name: rdp
    description: 堡垒机式 RDP 远程桌面网关
  - name: health
    description: 健康检查

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getHealth
      summary: 健康检查
      description: 检查进程与 PostgreSQL。数据库不可达时返回 503。无需鉴权，不校验 Origin。
      security: []
      responses:
        '200':
          description: 健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 主库不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 管理员登录
      description: 密码校验成功后设置 `opsmind_session` Cookie。按 IP 限流（5 次/分钟）。必须携带 Origin。
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: '登录成功；`Set-Cookie: opsmind_session=...; HttpOnly; SameSite=Lax; Path=/`'
          headers:
            Set-Cookie:
              description: 会话 Cookie
              schema:
                type: string
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 退出登录
      description: 删除当前会话并清除 Cookie。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: 已退出
          headers:
            Set-Cookie:
              description: 过期 Cookie
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前登录用户
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: 修改管理员密码
      description: |
        校验 `old_password` 后将密码更新为 `new_password`，写审计
        `auth.password_changed`；成功后吊销该用户全部会话（含当前会话），
        清除 `opsmind_session` Cookie，客户端须引导重新登录。
        `new_password` 长度 1..72 字节（bcrypt 明文上限）；`old_password`
        错误返回 401 并写审计 `auth.password_change_failed`。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 已修改；`Set-Cookie` 清除会话 Cookie
          headers:
            Set-Cookie:
              description: 过期 Cookie
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/servers:
    get:
      tags: [servers]
      operationId: listServers
      summary: 服务器列表
      responses:
        '200':
          description: 服务器列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [servers]
      operationId: createServer
      summary: 新增服务器
      description: 凭据字段只写不读。os=linux 时 auth_method 只能 password/private_key（SSH）；os=windows 还可用 password_ntlm/password_basic（WinRM，端口 winrm_port，默认 5985）。密码认证必须提供 `password`；私钥认证必须提供 `private_key`，`passphrase` 可选。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerCreate'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/servers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [servers]
      operationId: getServer
      summary: 服务器详情
      responses:
        '200':
          description: 服务器
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [servers]
      operationId: updateServer
      summary: 更新服务器
      description: 省略字段表示不变。提供任一凭据字段时必须同时提供 `auth_method`；提供 `auth_method` 时按该方式要求对应凭据。修改 host 或 port 会清空已信任的主机密钥。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerUpdate'
      responses:
        '200':
          description: 更新后的服务器
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [servers]
      operationId: deleteServer
      summary: 删除服务器
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/servers/{id}/test:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [servers]
      operationId: testServer
      summary: 测试服务器连接
      description: 按 os 与 auth_method 路由：SSH 通道（linux 全部；windows 的 password/private_key）做 SSH 握手、返回指纹；WinRM 通道（windows 的 password_ntlm/password_basic，端口 winrm_port）做 WinRM 握手（Get-WmiObject Win32_ComputerSystem 探针），无主机密钥语义，fingerprint 恒为空串、first_seen 恒为 false。首次 SSH 连接返回 `first_seen=true` 并写审计；主机密钥变化返回 409。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: 连接成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/HostKeyChanged'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/servers/{id}/containers:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [containers]
      operationId: listContainers
      summary: 服务器容器列表
      description: 经现有执行通道调 docker/podman CLI（实时查询，不落库）。container_runtime 为空串时先同步探测并写回；network_device、runtime 为 none/containerd 时 400 CONTAINER_UNSUPPORTED。
      responses:
        '200':
          description: 容器列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/servers/{id}/containers/{cid}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/ContainerIdPath'
    get:
      tags: [containers]
      operationId: inspectContainer
      summary: 容器详情摘要（inspect）
      responses:
        '200':
          description: 容器详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/servers/{id}/containers/{cid}/action:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/ContainerIdPath'
    post:
      tags: [containers]
      operationId: containerAction
      summary: 容器操作（start/stop/restart）
      description: |
        六期起按统一审批门限（契约 2.11 约定 2）分流：NeedsApproval=true 时创建
        source=console 的审批（conversation_id/tool_call_id 为 null，command 为按
        运行时固化的逐字节命令）并返回 `approval`（execution=null），用户经
        POST /api/approvals/{id}/decide 决策，批准时同步执行；NeedsApproval=false
        时直接同步执行并返回 `execution`（approval=null）。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerActionRequest'
      responses:
        '200':
          description: 需审批时返回 approval（pending，execution=null）；门限判定直执行时返回 execution（approval=null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerActionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/servers/{id}/containers/{cid}/logs:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/ContainerIdPath'
    get:
      tags: [containers]
      operationId: containerLogs
      summary: 容器日志（最近 N 行）
      parameters:
        - name: tail
          in: query
          description: 行数；缺省 200。
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 200
      responses:
        '200':
          description: 容器日志（stdout+stderr 合并原文）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContainerLogsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/servers/{id}/images:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [containers]
      operationId: listServerImages
      summary: 服务器本地镜像列表
      responses:
        '200':
          description: 镜像列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/databases:
    get:
      tags: [databases]
      operationId: listDatabases
      summary: 数据库列表
      responses:
        '200':
          description: 数据库列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [databases]
      operationId: createDatabase
      summary: 新增数据库
      description: PostgreSQL/MySQL 需要 host、port、database_name、username；SQLite 只需要绝对路径 `sqlite_path`；mssql 需要 host、database_name、username、password，端口直连（默认 1433）或 instance_name 命名实例（此时 port=0）；redis 需要 host、port，username/password 可选，redis_db 默认 0。密码只写不读。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseCreate'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/databases/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [databases]
      operationId: getDatabase
      summary: 数据库详情
      responses:
        '200':
          description: 数据库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [databases]
      operationId: updateDatabase
      summary: 更新数据库
      description: 省略字段表示不变；`engine` 不可修改。`password` 提供时替换，空字符串表示清空。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatabaseUpdate'
      responses:
        '200':
          description: 更新后的数据库
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Database'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [databases]
      operationId: deleteDatabase
      summary: 删除数据库
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: 已删除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/databases/{id}/test:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [databases]
      operationId: testDatabase
      summary: 测试数据库连接
      description: 使用保存的凭据建立只读连接并执行最小探针。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: 连接成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatabaseTestResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/databases/{id}/query:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [databases]
      operationId: queryDatabase
      summary: 执行只读 SQL
      description: |
        只允许单条 SELECT、WITH...SELECT、EXPLAIN（非 ANALYZE）。写语句、DDL、多语句返回 422 `SQL_NOT_READONLY`，不会执行，也不会创建审批。
        结果最多 1000 行 / 1MB；超限时 `truncated=true`。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SqlQueryRequest'
      responses:
        '200':
          description: 查询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SqlQueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/SqlNotReadOnly'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/providers/presets:
    get:
      tags: [providers]
      operationId: listProviderPresets
      summary: 内置供应商预设
      description: 返回 9 个预设（8 个内置 + custom）。不含任何密钥。
      responses:
        '200':
          description: 预设列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPresetList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/providers:
    get:
      tags: [providers]
      operationId: listProviders
      summary: 供应商列表
      responses:
        '200':
          description: 供应商列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderList'
