    ToolCall:
      type: object
      required:
        - id
        - seq
        - conversation_id
        - turn_id
        - provider_call_id
        - name
        - arguments
        - result
        - risk_level
        - status
        - error_code
        - error_message
        - approval_mode
        - started_at
        - finished_at
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          minimum: 1
        conversation_id:
          type: string
          format: uuid
        turn_id:
          type: string
          format: uuid
        provider_call_id:
          type: string
        name:
          type: string
        arguments:
          type: object
          additionalProperties: true
        result:
          type: [object, 'null']
          additionalProperties: true
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        status:
          $ref: '#/components/schemas/ToolCallStatus'
        error_code:
          $ref: '#/components/schemas/MaybeErrorCode'
          description: |
            空字符串表示无错误。六期打磨 sprint 3：审批因回答流中断被连带取消的
            调用落 `APPROVAL_CANCELLED`（status=expired），不再永久停在
            awaiting_approval——与同会话审批卡（expired + note=stream_cancelled
            显示为「已取消」）口径一致。
        error_message:
          type: string
          description: 失败的底层原因（与 SSE tool_result.error.message 一致）；空字符串表示无错误或无消息。
        approval_mode:
          type: string
          enum: ['', all, standard, high, none]
          description: |
            判定时的有效审批门限快照（六期打磨 sprint 1，tool_calls.approval_mode，
            迁移 00010）。仅命令执行类工具（ssh_exec / container_action /
            batch_execute）记录；其余工具与 00010 之前的旧行为空串（前端不渲染
            门限徽标）。刷新/重新进入会话后工具卡的「在 <mode> 门限下执行」徽标
            据此持久化显示，与 SSE tool_result.approval_mode 同源。
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, 'null']
          format: date-time
    ToolCallPage:
      type: object
      required: [items, has_more, next_before_seq]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
        has_more:
          type: boolean
        next_before_seq:
          type: [integer, 'null']
          format: int64

    ApprovalMode:
      type: string
      enum: [all, standard, high, none]
      description: |
        审批门限四档（六期契约 2.11 约定 1）：all=全部命令审批（含只读）；
        standard=危险命令审批、只读免审（一至五期现行默认）；high=仅高危审批
        （warning 级 needs_approval 也免审）；none=免审批、全部自动执行（仍必须
        落审计；auto_exec_enabled=false 为服务器级硬保护——非只读命令一律审批）。

    ReplayStep:
      type: object
      required: [seq, timestamp, kind]
      additionalProperties: false
      description: |
        回放单步（六期定义，八期扩展）。除 seq/timestamp/kind 外字段按 kind 可空：
        字段全集写死，未用字段为 null（不缺省键）。各 kind 的字段契约：
        user_message/assistant_text/reasoning→message_id+content（reasoning 另带
        reasoning_duration_ms；user_message 的 content 已剥离 ChatPage 的
        `<!--opsmind-context … -->` 内部上下文前缀）；
        tool_call→tool_call_id+name+arguments+risk_level+status+error_code+
        approval_mode+result_summary（八期：全部 18 个工具恒非 null）；
        approval→approval_id+tool_call_id+source+server_name+command+
        original_command+risk_level+edited_risk_level+status；
        execution→tool_call_id+name+command+status+exit_code+output+error_code+
        duration_ms（六期），八期另加 result_summary+result_truncated+
        affected_servers+server_name，按工具 kind 带 diagnosis_id /
        inspection_report_id / batch_job_id（契约 7.8）。
        execution 的生成范围：六期仅 ssh_exec/container_action；八期扩到 11 个
        动作类工具（见契约 7.8 矩阵）——其余 7 个本地查询/交互工具（含只读
        本系统库的 get_inspection_report）不生成 execution 步，但 tool_call 步
        带 result_summary。失败且无 result 的动作类
        调用也生成 status=failed + error_code 的 execution 步（exit_code=-1、
        output 为空串）；denied/expired 等「命令从未执行」不生成。
        八期 `command` 对非命令类工具承载动作串（如 `docker ps -a`、
        `inspection:full`、`diagnosis:<id>`），UI 按 name 标注「命令」或「动作」。
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          description: 重建后统一重编的全局序（1..N，升序即时间序）。
        timestamp:
          type: string
          format: date-time
        kind:
          type: string
          enum: [user_message, assistant_text, reasoning, tool_call, approval, execution]
        message_id:
          type: [string, 'null']
          format: uuid
        tool_call_id:
          type: [string, 'null']
          format: uuid
        approval_id:
          type: [string, 'null']
          format: uuid
        name:
          type: [string, 'null']
          description: 工具名（tool_call/execution）。
        source:
          type: [string, 'null']
          enum: [chat, console, batch, 'null']
          description: 审批发起来源（approval）。
        server_name:
          type: [string, 'null']
          description: |
            服务器名。approval 步为审批目标服务器名（六期；服务器删除后空串）；
            八期起 execution 步在单目标动作（affected_servers 恰好 1 个）时同值，
            多目标/无目标为 null；tool_call 步恒 null（服务器在 arguments 与
            execution 步）。其余 kind 为 null。
        content:
          type: [string, 'null']
          description: 文本内容（user_message/assistant_text/reasoning）。
        reasoning_duration_ms:
          type: [integer, 'null']
          format: int64
          minimum: 0
          description: |
            该轮 reasoning 服务端计时毫秒（六期打磨 sprint 1，仅 reasoning 步）：
            取自 messages.reasoning_duration_ms；null = 无计时数据（00009 之前的
            旧消息或非 reasoning 步）。回放播放器的「深度思考 · 耗时 Ns」据此
            与消息页保持一致。
        command:
          type: [string, 'null']
          description: 实际执行命令（approval/execution；审批被改写时为改写后命令）。
        original_command:
          type: [string, 'null']
          description: 审批原命令（approval；仅被改写时非 null）。
        arguments:
          type: [object, 'null']
          additionalProperties: true
          description: 工具调用参数（tool_call）。
        risk_level:
          type: [string, 'null']
          enum: [safe, needs_approval, forbidden, 'null']
          description: 风险级别（tool_call/approval；approval 为原始命令级别）。
        edited_risk_level:
          type: [string, 'null']
          enum: [safe, needs_approval, 'null']
          description: 改写后命令级别（approval；未改写为 null）。
        status:
          type: [string, 'null']
          description: 状态（tool_call 的 ToolCallStatus / approval 的 ApprovalStatus / execution 为 succeeded|failed）。
        exit_code:
          type: [integer, 'null']
          description: |
            退出码（execution）。仅 ssh_exec / container_action 有该语义（取
            result.exit_code；通道失败 -1）；八期其余动作类工具为 null
            （container_list/db_query 等没有「退出码」，不得填 0 伪装成功）。
        output:
          type: [string, 'null']
          description: |
            执行输出原文（execution；八期起恒非 null）。取值按工具固定键：
            ssh_exec/container_action/container_logs 取 result.output；
            server_facts 取 result.raw_output；container_list/inspect/image_list/
            db_query/batch_execute/run_diagnosis/run_inspection 取
            JSON.stringify(result)（契约 7.8 的表）。tool_calls.result 已受
            ToolResultBytes 64KB 截断：整包被换成
            {"truncated":true,"original_bytes":N,"preview":"…"} 时 output=preview
            且 result_truncated=true（不得渲染为空）。
            八期第二道预算：响应序列化超 8 MiB 时从最旧步起把 output 置空串并
            置 result_truncated=true（契约 2.12 约定 6）——空串 + result_truncated
            =true 表示「有输出但为控体积未下发」，与 null（非 execution 步）区分。
        error_code:
          type: [string, 'null']
          description: |
            错误码（tool_call/execution）。六期打磨 sprint 2 起 tool_call 步也
            填充（openapi 早已声明但此前恒 null）：失败的调用可直接看出
            SSH_EXEC_FAILED 等原因；execution 步同样携带。
        approval_mode:
          type: [string, 'null']
          enum: [all, standard, high, none, 'null']
          description: |
            判定时的有效审批门限快照（tool_call 步；取自 tool_calls.approval_mode，
            六期打磨 sprint 2）。回放据此复用聊天侧的免审批判定：none/high 档下
            needs_approval 命令未建审批且已执行时显示「高风险 · 免审批执行」而不是
            「需审批」。null=非命令执行类工具，或 00010 之前的旧行未记录。
        duration_ms:
          type: [integer, 'null']
          minimum: 0
          description: |
            执行耗时毫秒（execution，八期起恒非 null）：优先取 result.duration_ms
            （ssh_exec/container_action/db_query 等带耗时字段的工具），否则取
            tool_calls 的 finished_at - started_at（契约 7.8）。非 execution 步为 null。
        result_summary:
          type: [string, 'null']
          description: |
            工具结果的一句话摘要（八期，契约 7.8）。**tool_call 步恒非 null**
            （失败调用为 `error=<error_code>`，无结果为「无结果」；7 个本地查询/
            交互工具只有 tool_call 步，摘要即其唯一结果呈现）；**execution 步
            恒非 null**（11 个动作类工具的一句话结论，如 `<n> 个容器`、
            `<row_count> 行 · 12ms`、`3 台 · 均分 72 · 2 异常`）。总长 ≤200
            rune，超出截断补 `…`（此时 result_truncated=true）。其余 kind 为 null。
        result_truncated:
          type: [boolean, 'null']
          description: |
            该步输出是否被截断（八期，仅 execution 步）。来源：命令类/容器日志/
            db_query 取 `result.truncated`；run_inspection 取任一 item 的
            `truncated`；result_summary 自身超长时为 true。null=非 execution 步。
            **这是「输出是否完整」的唯一判据**——前端据此显示「输出已截断」。
        affected_servers:
          type: [array, 'null']
          description: |
            该动作实际触达的服务器名清单（八期，仅 execution 步；契约 7.8）。
            单目标动作为 1 元素、batch_execute/run_inspection 为多元素（真实执行面：
            batch_jobs.server_ids / inspection_report_items 的 server_id JOIN 名，
            不只信模型参数）、db_query 为 null（外部数据库不是服务器资产）。
            本地查询/交互工具不生成 execution 步，故该字段不出现在它们的步骤上；
            其余 kind 为 null。已删除资产以 `<已删除>` 占位。
          items:
            type: string
        diagnosis_id:
          type: [string, 'null']
          description: 诊断会话 ID（八期，仅 run_diagnosis 的 execution 步；播放器深链 `/alerts?diagnosis=`）。
        inspection_report_id:
          type: [string, 'null']
          description: |
            巡检报告 ID（八期，仅 run_inspection 的 execution 步）。get_inspection_report
            是本系统库只读查询、不生成 execution 步——它的报告 ID 在 tool_call 步的
            arguments.result_summary 里可见，不重复下发。
        batch_job_id:
          type: [string, 'null']
          description: 批量任务 ID（八期，仅 batch_execute 的 execution 步；深链 `/batch?job=`）。

    ReplayResponse:
      type: object
      required: [conversation_id, steps, truncated, truncated_reason]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          format: uuid
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReplayStep'
          maxItems: 20000
        truncated:
          type: boolean
          description: 有步骤/审批被丢弃时为 true（11 节防 OOM）；原因见 truncated_reason。
        truncated_reason:
          type: string
          enum: ['', steps, approvals, payload]
          description: |
            截断原因（六期打磨 sprint 4；八期扩 payload）。`''`=未截断；
            `steps`=步数超 20000 丢弃最旧；`approvals`=单状态审批满 200 条
            （approvals.List 无游标，4×200=800 上限），更早审批未纳入回放；
            `payload`=八期体积预算命中（arguments 装载超 6 MiB 或响应序列化超
            8 MiB，部分 arguments/output 被清空，契约 2.12 约定 6）。
            只报最高优先级的一个：`steps` > `payload` > `approvals`。四值各有
            独立中文文案（8.7，逐字写死）：`steps`=「超出 20000 步上限，仅显示
            最近 N 步」；`approvals`=「审批记录过多，仅显示最近 N 步（更早的审批
            未纳入回放）」；`payload`=「会话内容过大，部分参数与输出未下发（仅保留
            最近 N 步的摘要）」；`''`=不显示横幅。不得复用 steps 文案。

    ReplayCatalogItem:
      type: object
      required:
        - conversation_id
        - title
        - last_message_at
        - tool_count
        - action_count
        - approval_count
        - has_actions
        - truncated
      additionalProperties: false
      description: |
        回放目录单行（八期，契约 5.19.1）。计数由 tool_calls / approvals 聚合
        派生（不是前端拼装）；`has_actions` = action_count > 0（该会话存在至少
        一个动作类工具调用，契约 7.8 的 12 工具）；`truncated` 为步数上限预判。
      properties:
        conversation_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        last_message_at:
          type: string
          format: date-time
        tool_count:
          type: integer
          minimum: 0
          description: 会话内 tool_calls 总数（含纯本地查询工具）。
        action_count:
          type: integer
          minimum: 0
          description: 会话内动作类工具调用数（12 工具，含失败/被拒——它们也是动作事实）。
        approval_count:
          type: integer
          minimum: 0
          description: 会话内审批条数（含 pending/denied/expired）。
        has_actions:
          type: boolean
          description: action_count > 0。
        truncated:
          type: boolean
          description: |
            步数上限预判：tool_count + approval_count > 20000。
            仅预判步数上限（不预判 payload 预算——目录不应为此读 result）；
            为 true 时目录行显示「仅显示最近步」标记，进入页面后以真实
            ReplayResponse.truncated_reason 为准。

    ReplayCatalogPage:
      type: object
      required: [items, has_more, next_cursor]
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReplayCatalogItem'
          maxItems: 200
        has_more:
          type: boolean
        next_cursor:
          type: [object, 'null']
          description: 下一页游标（本页末行排序键）；has_more=false 时为 null。
          required: [last_message_at, id]
          properties:
            last_message_at:
              type: string
              format: date-time
            id:
              type: string
              format: uuid

    ChatRequest:
      type: object
      required: [conversation_id, content]
      additionalProperties: false
      properties:
        conversation_id:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 16000
        provider_id:
          type: string
          format: uuid
          description: 省略时使用会话已绑定供应商，其次第一个创建的供应商。
        model:
          type: string
          minLength: 1
          maxLength: 255
          description: 省略时使用会话已绑定模型或供应商默认模型。

    Approval:
      type: object
      required:
        - id
        - conversation_id
        - tool_call_id
        - source
        - server_id
        - server_name
        - command
        - risk_level
        - reason
        - status
        - approval_mode
        - requested_at
        - expires_at
        - decided_at
        - requested_by
        - requested_by_name
        - decided_by
        - note
        - edited_command
        - edited_risk_level
        - edited_rule_id
        - break_glass
        - legacy
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: [string, 'null']
          format: uuid
          description: console/batch 审批（source=console|batch）为 null；chat 审批恒非 null。
        tool_call_id:
          type: [string, 'null']
          format: uuid
          description: console/batch 审批为 null；chat 审批恒非 null。
        source:
          type: string
          enum: [chat, console, batch, terminal, policy]
          description: 审批发起来源（console 四期、batch 五期、terminal/policy 00012）。
        server_id:
          type: [string, 'null']
          format: uuid
        server_name:
          type: string
        command:
          type: string
        risk_level:
          type: string
          enum: [safe, needs_approval]
        rule_id:
          type: string
          description: 命中的风险规则 ID（如 RM_PROTECTED、FILE_WRITE）；历史数据可能为空串。
        reason:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        approval_mode:
          $ref: '#/components/schemas/ApprovalMode'
          description: 创建审批时的有效门限快照（六期 00008 起；历史行为 standard）。
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        requested_by:
          type: string
          format: uuid
          description: 发起人（00012 必填）；chat=会话 owner，console=HTTP 用户，batch=batch_jobs.created_by，terminal/policy=请求用户。
        requested_by_name:
          type: string
          description: 发起人 username/display_name（JOIN 派生，不落列）。
        decided_by:
          type: [string, 'null']
          format: uuid
        note:
          type: string
          maxLength: 500
        edited_command:
          type: string
          maxLength: 2000
          description: 历史字段（00012 起新行恒为空）；仅 legacy 行可非空，执行层永不读取。
        edited_risk_level:
          type: string
          enum: ['', safe, needs_approval]
          description: 历史字段；00012 起新行恒为空。
        edited_rule_id:
          type: string
          description: 历史字段；00012 起新行恒为空。
        grant_kind:
          type: [string, 'null']
          enum: [term, rdp, null]
          description: source=terminal 的 grant 类型。
        grant_expires_at:
          type: [string, 'null']
          format: date-time
        consumed_at:
          type: [string, 'null']
          format: date-time
        policy_from:
          type: [string, 'null']
          enum: [all, standard, high, none, null]
        policy_to:
          type: [string, 'null']
          enum: [all, standard, high, none, null]
        break_glass:
          type: boolean
          description: 仅主机侧 aiops break-glass 置 true。
        legacy:
          type: boolean
          description: 迁移前历史行；应用不得写 true。
    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
    ApprovalDecision:
      type: object
      required: [decision]
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, deny]
        note:
          type: string
          maxLength: 500

    ApprovalContext:
      type: object
      required: [approval, tool_call, server, messages]
      properties:
        approval:
          $ref: '#/components/schemas/Approval'
        tool_call:
          oneOf:
            - $ref: '#/components/schemas/ToolCall'
            - type: 'null'
        server:
          oneOf:
            - $ref: '#/components/schemas/Server'
            - type: 'null'
        messages:
          type: array
          description: 审批前最多 20 条消息；不含审批后的新消息。
          items:
            $ref: '#/components/schemas/Message'
    AuditVerifyResponse:
      type: object
      required: [ok, checked, first_id, window, legacy, head_id, head_hash]
      properties:
        ok:
          type: boolean
        checked:
          type: integer
          minimum: 0
        first_id:
          type: integer
          format: int64
          description: |
            本次校验覆盖的最小审计 id（空区间为 0）。页面据此展示「#first–#head」
            并声明更早记录未在本次范围内（第 2 轮走查：窗口是有界的，不能只报条数）。
        window:
          type: integer
          minimum: 1
          description: 本次实际生效的窗口上限（缺省与上限均为 200）。
        legacy:
          type: integer
          minimum: 0
          description: 本次区间内按 legacy 规则只校验链接的存量行数（00014 前，纳秒哈希输入不可恢复）。
        head_id:
          type: integer
          format: int64
        head_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
        broken_at:
          type: [integer, 'null']
          format: int64
          description: 链断点 id；ok=true 时为 null。
    AuditLog:
