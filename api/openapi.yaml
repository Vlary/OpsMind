  /api/conversations/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [conversations]
      operationId: conversationReplay
      summary: 会话执行回放（六期）
      description: |
        从持久化表（messages / tool_calls / approvals）重建会话的有序事件序列，
        用于回放播放器。排序写死：timestamp ASC；同 timestamp 按 kind 权重
        user_message(0) → tool_call(1) → approval(2) → execution(3) →
        reasoning(4) → assistant_text(5)，同权重内按来源 seq/id 升序；
        输出统一重编 seq=1..N（契约 2.11 约定 4）。
        步数上限 20000：超出丢弃最旧步骤并置顶层 truncated=true（11 节）。
        另有一处独立截断：单状态审批满 200 条（approvals.List 无游标）时更早
        审批不纳入回放。两种来源的 truncated 均为 true，具体原因见
        truncated_reason（`steps` / `approvals`；未截断为空串）。
        权限与 GET /api/conversations/{id}/messages 相同（登录态；v1 单管理员）。
      responses:
        '200':
          description: 有序回放步骤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chat:
    post:
      tags: [chat]
      operationId: chat
      summary: 发送消息并流式接收回答
      description: |
        成功返回 `text/event-stream`。响应不压缩，`X-Accel-Buffering: no`，每事件立即 flush，15s 心跳。
        进入 SSE 前的错误（无供应商、会话不存在、已有活跃流等）返回普通 JSON 错误。
        进入 SSE 后错误只通过 `event: error` 发送，HTTP 状态保持 200。SSE 不自动重连。
        必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 'SSE 流。`done` 与 `error` 互斥且为最后一个事件；心跳为 `: ping`。'
          headers:
            X-Accel-Buffering:
              description: 固定 `no`
              schema:
                type: string
                const: 'no'
            Cache-Control:
              description: 固定 `no-cache, no-transform`
              schema:
                type: string
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧，事件 schema 见 x-sse-events
          x-sse-events:
            heartbeat:
              format: ': ping\n\n'
              description: 连续 15s 无事件时发送
            token:
              schema:
                $ref: '#/components/schemas/SseToken'
            reasoning:
              schema:
                $ref: '#/components/schemas/SseReasoning'
            tool_call:
              schema:
                $ref: '#/components/schemas/SseToolCall'
            tool_result:
              schema:
                $ref: '#/components/schemas/SseToolResult'
            approval_required:
              schema:
                $ref: '#/components/schemas/Approval'
            approval_resolved:
              schema:
                $ref: '#/components/schemas/SseApprovalResolved'
            done:
              schema:
                $ref: '#/components/schemas/SseDone'
            error:
              schema:
                $ref: '#/components/schemas/SseError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话已有活跃流，或会话已绑定其他供应商/模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 未配置供应商
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NO_PROVIDER_CONFIGURED
                  message: no LLM provider is configured
                  request_id: 0123456789abcdef
        '429':
          description: 全局流并发达到上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

