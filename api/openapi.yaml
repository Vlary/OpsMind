  /api/audit/verify:
    get:
      tags: [audit]
      operationId: verifyAuditChain
      summary: 校验审计哈希链
      description: |
        需要权限 `audit:read`。重算指定区间（缺省最近 200 条）的 prev_hash/hash，
        并与外部 anchor 比对。链完整返回 ok=true；篡改返回 409 AUDIT_CHAIN_BROKEN，
        其 `error.details` 带 broken_at / checked / head_id / head_hash / legacy。
        00014 迁移前的存量行按 legacy 规则只校验链接、不做哈希复算，计入 `legacy`；
        新行必须完整复算。读取本身写 audit.verify 审计。
      parameters:
        - name: from_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: to_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 哈希链断裂（AUDIT_CHAIN_BROKEN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

