          default: linux
          description: 选择规则分册：linux 用第 7.3 节 shell 分册；windows 用 PowerShell/cmd 分册（契约 7.3B）；network 用网络设备分册（契约 7.3C，brand 缺省 generic）。
        netdev_brand:
          $ref: '#/components/schemas/NetdevBrand'
          default: generic
          description: 仅 os=network 时生效（三期）：选择网络设备分册（cisco/huawei/h3c/junos/generic）。
        server_id:
          type: string
          format: uuid
          description: 仅用于上下文；提供且存在时以该服务器实际 os（network_device 时连同 netdev_brand）覆盖显式 os/netdev_brand。
