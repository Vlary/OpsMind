        actor_id:
          type: string
        actor_name:
          description: 操作者用户名；仅 actor_type=user 且能匹配到用户时非空，否则 null。
          type: [string, 'null']
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        request_id:
          type: string
        conversation_id:
          type: [string, 'null']
          format: uuid
        server_id:
          type: [string, 'null']
          format: uuid
        ip:
          type: string
        detail:
          type: object
