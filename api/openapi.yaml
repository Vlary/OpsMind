      summary: 会话列表
      description: |
        按 `last_message_at DESC, id DESC` 游标分页返回。缺省 limit=200（兼容
        旧契约首屏）；带游标参数返回排序在 (before_last_message_at, before_id)
        之后的更早会话。`next_cursor` 为下一页游标，`has_more=false` 时为 null。
      parameters:
        - name: limit
          in: query
          description: 每页数量，缺省 200。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
        - name: before_last_message_at
          in: query
          description: 上一页末条会话的 last_message_at（RFC3339）；必须与 before_id 成对出现。
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: 上一页末条会话 ID；必须与 before_last_message_at 成对出现。
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 会话列表（分页）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
