  /api/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: 读取公开系统设置（六期）
      description: |
        只返回契约公开键（v1 仅 approval_mode——全局审批门限，契约 2.11 约定 1）；
        内部键（bootstrap.*、monitor.*）不暴露。settings['approval.mode'] 缺失时
        按 standard 兜底返回。monitor.collector 继续走 GET/PUT /api/monitor/collector。
        七期起明确：**主题偏好不属于本端点**——light/dark/system 三态存浏览器
        localStorage（键 opsmind.theme），理由是登录页首次绘制早于任何 API
        （本端点在鉴权组，未登录取不到），且纯展示偏好不应产生 settings.update
        审计；详见契约 8.3.12。禁止为本偏好扩展本响应。
      responses:
        '200':
          description: 设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [settings]
      operationId: updateSettings
      summary: 更新公开系统设置（六期）
      description: |
        写 settings['approval.mode']（JSON 字符串）。变更对后续新审批即时生效
        （已 pending 的审批不迁移、按创建时快照展示）。写审计 settings.update。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdate'
      responses:
        '200':
          description: 更新后的设置（收紧/同档直接生效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '202':
          description: |
            放宽门限已创建 source=policy 审批，等待第二位审批者批准；settings 未变更。
          content:
            application/json:
              schema:
                type: object
                required: [approval_mode, pending_approval]
                properties:
                  approval_mode:
                    $ref: '#/components/schemas/ApprovalMode'
                  pending_approval:
                    $ref: '#/components/schemas/Approval'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/term/grants:
    get:
      tags: [terminal]
      operationId: listTerminalGrants
      summary: 本人可用的 JIT 终端授权（00012 第 2 轮走查）
      description: |
        返回当前用户 `approved` 且未消费、未过期的 `source=terminal` 授权
        （`grant_kind=term`），按 `grant_expires_at` 升序（最先到期在前）。
        只按 `requested_by=当前用户` 过滤——他人授权即便有 `audit:read` 也不
        可见（授权是个人凭据）。发起人据此在终端页提示「你有 N 条已批准授权」
        并直接打开终端（会话创建时按 `grant_id` 单次消费）。
      responses:
        '200':
          description: 可用授权列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalGrantList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [terminal]
      operationId: createTerminalGrant
      summary: 申请 JIT 终端授权（00012）
      description: |
        创建 source=terminal/grant_kind=term 审批（grant 有效期 30 分钟），
        由另一位有审批权限的用户经 POST /api/approvals/{id}/decide 批准；
        创建会话时携带 grant_id 单次消费。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalGrantCreate'
      responses:
        '202':
          description: 已创建待批准 grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalGrantCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/term/sessions:
    post:
      tags: [terminal]
      operationId: createTerminalSession
      summary: 创建终端会话
      description: |
        为 server_id 打开堡垒机式交互终端。仅支持 SSH 通道的服务器（os=linux，
        或 os=windows 且 auth_method 为 password/private_key）；WinRM 认证的
        服务器无 PTY 语义，返回 400 `TERM_UNSUPPORTED`。同一服务器同时只允许
        一个活动会话（409 `TERM_SESSION_EXISTS`）；全局活动会话达到上限返回
        429 `TERM_SESSION_LIMIT`。创建即写审计 `session.start`（resource_type=
        terminal_session）。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalSessionCreate'
      responses:
        '201':
          description: 已创建；随 ws_url 建立 WebSocket 后开始传输
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [terminal]
      operationId: listTerminalSessions
      summary: 终端会话列表
      description: 按 created_at DESC, id DESC 返回，`status` 过滤可选（active|closed）。
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InteractiveSessionStatus'
        - name: server_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSessionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/term/sessions/{id}/ws:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [terminal]
      operationId: terminalSessionSocket
      summary: 终端 WebSocket 通道
      description: |
        升级为 WebSocket（子协议必须为 `opsmind-term-v1`，缺失或不匹配返回
        400 `TERM_WS_PROTOCOL`）。鉴权与 Origin 同 REST：升级前校验
        `opsmind_session` Cookie 与 Origin 精确匹配，失败分别 401/403。
        会话行必须为 active 且属于当前用户，否则 404/409。连接建立后服务端
        通过 SSH PTY 双向转发；仅输出流录制为 asciinema v2。空闲 10 分钟或
        时长满 8 小时服务端主动断开；任一方断开即关闭 PTY、封盘录制并写
        审计 `session.end` 与 `session.input_summary`。帧格式见
        x-websocket-events 与 docs/CONTRACT.md 第 11 节。
      responses:
        '101':
          description: 协议升级为 WebSocket（子协议 opsmind-term-v1）
          content:
            application/json:
              schema:
                type: string
          x-websocket-events:
            client_input:
              schema:
                $ref: '#/components/schemas/TermFrameInput'
            client_resize:
              schema:
                $ref: '#/components/schemas/TermFrameResize'
            server_output:
              schema:
                $ref: '#/components/schemas/TermFrameOutput'
            server_resized:
              schema:
                $ref: '#/components/schemas/TermFrameResized'
            server_error:
              schema:
                $ref: '#/components/schemas/TermFrameError'
            server_closed:
              schema:
                $ref: '#/components/schemas/TermFrameClosed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/term/recordings:
    get:
      tags: [terminal]
      operationId: listTerminalRecordings
      summary: 终端录制列表
      description: 返回有录制文件的已结束终端会话（status=closed 且 recording_file 非空），按 started_at DESC。
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 录制列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalRecordingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/term/recordings/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [terminal]
      operationId: downloadTerminalRecording
      summary: 下载终端录制
      description: |
        以 asciinema v2（.cast）下发会话输出流录制。id 为终端会话 ID；文件名
        `<id>.cast` 不可预测。会话不存在返回 404 `TERM_SESSION_NOT_FOUND`，
        无录制或文件缺失返回 404 `RECORDING_NOT_FOUND` / 502
        `RECORDING_UNAVAILABLE`。
      responses:
        '200':
          description: asciicast v2 文件
          content:
            application/x-asciicast:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/rdp/grants:
    get:
      tags: [terminal]
      operationId: listRdpGrants
      summary: 本人可用的 JIT RDP 授权（00012 第 2 轮走查）
      description: 同终端；`grant_kind=rdp`。
      responses:
        '200':
          description: 可用授权列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalGrantList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [terminal]
      operationId: createRdpGrant
      summary: 申请 JIT RDP 授权（00012）
      description: 同终端 grant；grant_kind=rdp，批准后由创建 RDP 会话单次消费。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalGrantCreate'
      responses:
        '202':
          description: 已创建待批准 grant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalGrantCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/rdp/sessions:
    post:
      tags: [rdp]
      operationId: createRdpSession
      summary: 创建 RDP 会话
      description: |
        为 os=windows 的服务器打开 RDP 网关会话。分辨率在创建时固定（运行中
        不支持 resize）。服务器必须已保存密码凭据（auth_method=password/
        password_ntlm/password_basic），否则 400 `RDP_NO_CREDENTIALS`；非
        windows 服务器 400 `RDP_UNSUPPORTED`；guacd 未配置或不可达 503
        `GUACD_UNAVAILABLE`。同一服务器同时只允许一个活动会话；全局上限
        429。创建即写审计 `session.start`（resource_type=rdp_session）。
        服务器凭据在 Go 网关注入 guacd 握手，绝不进入浏览器。必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RdpSessionCreate'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdpSessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [rdp]
      operationId: listRdpSessions
      summary: RDP 会话列表
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InteractiveSessionStatus'
        - name: server_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 会话列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdpSessionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/rdp/sessions/{id}/ws:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [rdp]
      operationId: rdpSessionSocket
      summary: RDP WebSocket 通道（guacamole 协议透传）
      description: |
        升级为 WebSocket（无子协议要求，兼容 guacamole-common-js 的
        WebSocketTunnel）。鉴权与 Origin 同 REST。服务端连接 guacd（TCP
        4822），select rdp 后在握手 args 注入 hostname/port/username/
        password/security/ignore-cert/width/height/dpi/recording-name，随后
        与浏览器双向透传字节流；不解析 guacamole 指令语义。空闲 30 分钟或
        时长满 8 小时断开；断开即结束 guacd 连接并写审计 `session.end`。
      responses:
        '101':
          description: 协议升级为 WebSocket；载荷为 guacamole 协议（长度前缀指令流），Go 侧纯透传
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/rdp/recordings:
    get:
      tags: [rdp]
      operationId: listRdpRecordings
      summary: RDP 录制列表
      description: 返回有录制文件的已结束 RDP 会话（guacd 侧 recording-name 命中的 .guac 文件），按 started_at DESC。
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 录制列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdpRecordingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/rdp/recordings/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [rdp]
      operationId: downloadRdpRecording
      summary: 下载 RDP 录制
      description: |
        下发 guacd 原生 .guac 录制文件（application/octet-stream）；转码不在
        二期范围。文件名 `<id>.guac` 不可预测。
      responses:
        '200':
          description: guacamole 录制文件
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: opsmind_session
      description: 登录成功后由服务端设置的 HttpOnly 会话 Cookie。

  headers:
    XRequestID:
      description: 请求 ID；与错误体中的 request_id 一致。
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,64}$'

  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: 必须精确匹配允许的 Origin；缺失或不匹配返回 403。
      schema:
        type: string
        examples:
          - http://localhost:5173
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContainerIdPath:
      name: cid
      in: path
      required: true
      description: 容器 ID 或名称；必须匹配 ^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]{0,127}$'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    BadRequest:
      description: 参数校验失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录或会话过期
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OriginForbidden:
      description: Origin 缺失或不匹配
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 已登录但缺少所需权限（403 FORBIDDEN），或职责分离/自我操作等授权拒绝
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源冲突（重名、重复、状态不允许）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    HostKeyChanged:
      description: SSH 主机密钥与已信任值不一致，命令未执行
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SqlNotReadOnly:
      description: SQL 非只读、包含多语句或被守卫拒绝
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 登录限流或流并发超限
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          description: 建议重试秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: 上游（SSH、数据库、LLM）失败
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: 上游超时
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 依赖组件（guacd）不可用或服务关闭中
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: 服务内部错误
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorCode:
      type: string
      description: 错误码。实现集中在 internal/apierr/codes.go。
      enum:
        - AUTH_REQUIRED
        - AUTH_INVALID
        - AUTH_RATE_LIMITED
        - ORIGIN_FORBIDDEN
        - VALIDATION_FAILED
        - NOT_FOUND
        - CONFLICT
        - INTERNAL
        - SERVICE_UNAVAILABLE
        - TOO_MANY_STREAMS
        - STREAM_ACTIVE
        - CONVERSATION_NOT_FOUND
        - CONVERSATION_MODEL_LOCKED
        - NO_PROVIDER_CONFIGURED
        - PROVIDER_NOT_FOUND
        - PROVIDER_TEST_FAILED
        - PROVIDER_MODELS_FAILED
        - SERVER_NOT_FOUND
        - SERVER_TEST_FAILED
        - SSH_HOST_KEY_CHANGED
        - SSH_TIMEOUT
        - SSH_EXEC_FAILED
        - COMMAND_TOO_LARGE
        - COMMAND_INVALID
        - COMMAND_FORBIDDEN
        - DATABASE_NOT_FOUND
        - DATABASE_TEST_FAILED
        - SQL_NOT_READONLY
        - SQL_TIMEOUT
        - SQL_QUERY_FAILED
        - APPROVAL_NOT_FOUND
        - APPROVAL_NOT_PENDING
        - APPROVAL_DENIED
        - APPROVAL_TIMEOUT
        - APPROVAL_CANCELLED
        - APPROVAL_SELF_DECISION
        - APPROVAL_LEGACY_EDIT
        - APPROVAL_MODE_WIDENING_FORBIDDEN
        - POLICY_STALE
        - NO_SECOND_APPROVER
        - LAST_ADMIN
        - SELF_OPERATION
        - FORBIDDEN
        - PASSWORD_CHANGE_REQUIRED
        - SELF_REDEEM_FORBIDDEN
        - DELIVERY_UNAVAILABLE
        - TERMINAL_APPROVAL_REQUIRED
        - TERMINAL_GRANT_KIND_MISMATCH
        - AUDIT_CHAIN_BROKEN
        - TOOL_FORBIDDEN
        - TOOL_NOT_FOUND
        - TOOL_ARGS_INVALID
        - AGENT_MAX_ITERATIONS
        - LLM_UPSTREAM_ERROR
        - LLM_TIMEOUT
        - LLM_OUTPUT_TRUNCATED
        - LLM_STREAM_ERROR
        - AUDIT_WRITE_FAILED
        - STREAM_TIMEOUT
        - SERVER_SHUTTING_DOWN
        - APPROVAL_STREAM_CANCELLED
        - CLIENT_DISCONNECTED
        - TERM_SESSION_NOT_FOUND
        - TERM_SESSION_EXISTS
        - TERM_SESSION_LIMIT
        - TERM_CONNECT_FAILED
        - TERM_UNSUPPORTED
        - TERM_WS_PROTOCOL
        - RECORDING_NOT_FOUND
        - RECORDING_UNAVAILABLE
        - RDP_SESSION_NOT_FOUND
        - RDP_SESSION_EXISTS
        - RDP_SESSION_LIMIT
        - RDP_CONNECT_FAILED
        - RDP_UNSUPPORTED
        - RDP_NO_CREDENTIALS
        - GUACD_UNAVAILABLE
        - NETCLI_LOGIN_FAILED
        - NETCLI_EXEC_FAILED
        - CONTAINER_UNSUPPORTED
        - CONTAINER_NOT_FOUND
        - CONTAINER_CLI_FAILED
    MaybeErrorCode:
      description: 错误码；空字符串表示无错误。
      oneOf:
        - $ref: '#/components/schemas/ErrorCode'
        - type: string
          const: ''
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: 英文短句；前端按 code 显示中文。
          minLength: 1
          maxLength: 500
        request_id:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,64}$'
        details:
          type: object
          additionalProperties: true
          description: 非敏感结构化细节；可省略。
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    RiskLevel:
      type: string
      enum: [safe, needs_approval, forbidden]
    ApprovalStatus:
      type: string
      enum: [pending, approved, denied, expired]
    AuthMethod:
      type: string
      description: 'linux：password|private_key（SSH）。windows：password|private_key（Windows OpenSSH，走 SSH）或 password_ntlm|password_basic（WinRM，端口 winrm_port）。network_device（三期）：仅 password（SSH 或 Telnet）。'
      enum: [password, private_key, password_ntlm, password_basic]
    DeviceKind:
      type: string
      description: 资产形态（三期）：server=主机（linux/windows）；network_device=网络设备（交换机/路由器/防火墙，CLI 行协议）。
      enum: [server, network_device]
    NetdevBrand:
      type: string
      description: 网络设备厂商（三期），决定 netcli profile 与风险分册；仅 device_kind=network_device 时非空。
      enum: [cisco, huawei, h3c, junos, generic]
    AccessProto:
      type: string
      description: 网络设备接入协议（三期）。telnet 为明文传输，创建/更新必须显式携带 confirm_telnet_cleartext=true。
      enum: [ssh, telnet]
    DatabaseEngine:
      type: string
      enum: [postgres, mysql, sqlite, mssql, redis, mongodb]
    TargetOS:
      type: string
      description: server 类资产的操作系统；network 仅用于 device_kind=network_device（网络设备风险分册路由）。
      enum: [linux, windows, network]
    ProviderKind:
      type: string
      enum: [openai_compatible, anthropic]
    ProviderPresetName:
      type: string
      enum: [openai, deepseek, dashscope, moonshot, zhipu, anthropic, gemini, ollama, custom]
    SSLMode:
      type: string
      enum: [disable, prefer, require, verify-ca, verify-full]
    MessageRole:
      type: string
      enum: [user, assistant]
    MessageStatus:
      type: string
      enum: [complete, error]
    ToolCallStatus:
      type: string
      enum: [started, awaiting_approval, succeeded, failed, denied, expired, awaiting_user]

    Role:
      type: string
      description: 固定角色；每用户恰一个。
      enum: [admin, operator, approver, auditor]
    Permission:
      type: string
      description: 权限串（resource:action）；完整矩阵见 docs/CONTRACT.md 12.2。
      enum:
        - chat:use
        - asset:read
        - asset:write
        - asset:test
        - exec:read
        - exec:write
        - monitor:read
        - monitor:manage
        - inspection:manage
        - terminal:use
        - approval:read
        - approval:decide
        - approval:policy
        - audit:read
        - provider:manage
        - user:read
        - user:write
        - user:credential_reset
        - debug:read
    User:
      type: object
      required: [id, username, role, enabled, display_name, email, invite_pending, must_change_password, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
          description: false=停用；登录与存量会话一律失效。
        display_name:
          type: string
          maxLength: 100
        email:
          type: string
          description: 邀请/重置 token 的独立投递地址；可为空串（历史 admin）。
        invite_pending:
          type: boolean
          description: 派生字段：是否存在未使用的 invite token（含已过期）；不落列。为 true 时只能重发邀请，不能启用或重置密码。
        must_change_password:
          type: boolean
          description: 离线 admin reset 后为 true；为 true 时除 me/logout/change-password 外全部 403 PASSWORD_CHANGE_REQUIRED。
        created_by:
          type: string
          format: uuid
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserCreate:
      type: object
      required: [username, email, role]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/Role'
        display_name:
          type: string
          maxLength: 100
    UserUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role:
          $ref: '#/components/schemas/Role'
        enabled:
          type: boolean
        display_name:
          type: string
          maxLength: 100
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
    InviteAcceptRequest:
      type: object
      required: [token, new_password]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 128
        new_password:
          type: string
          minLength: 1
          maxLength: 72
        display_name:
          type: string
          maxLength: 100
    CredentialResetResponse:
      type: object
      required: [user_id, expires_at, delivered]
      properties:
        user_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        delivered:
          type: boolean
          description: token 已投递到目标 email；响应不包含 token。
    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
    PasswordChangeRequest:
      type: object
      required: [old_password, new_password]
      additionalProperties: false
      properties:
        old_password:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 1
          maxLength: 72
          description: 长度按字节计（bcrypt 明文上限 72 字节）。
    LoginResponse:
      type: object
      required: [user, permissions]
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
    MeResponse:
      type: object
      required: [user, permissions]
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    Server:
      type: object
      required:
        - id
        - name
        - device_kind
        - os
        - netdev_brand
        - access_proto
        - host
        - port
        - winrm_port
        - username
        - auth_method
        - tags
        - auto_exec_enabled
        - has_password
        - has_private_key
        - has_enable_secret
        - container_runtime
        - host_key_fingerprint
        - host_key_verified_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        device_kind:
          $ref: '#/components/schemas/DeviceKind'
        os:
          $ref: '#/components/schemas/TargetOS'
          description: device_kind=server 时 linux|windows；network_device 时恒 network。
        netdev_brand:
          $ref: '#/components/schemas/NetdevBrand'
          description: 仅 network_device 非空；server 恒空串。
        access_proto:
          $ref: '#/components/schemas/AccessProto'
          description: 仅 network_device 有意义（ssh|telnet）；server 恒 ssh。
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: SSH 端口（linux/windows 的 OpenSSH 与网络设备 SSH/Telnet 共用）。
        winrm_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: WinRM 端口；仅 auth_method 为 password_ntlm/password_basic 时使用，其余情况仍返回该字段但不参与连接。
        username:
          type: string
          minLength: 1
          maxLength: 100
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        tags:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 32
        auto_exec_enabled:
          type: boolean
        has_password:
          type: boolean
        has_private_key:
          type: boolean
        has_enable_secret:
          type: boolean
          description: 网络设备 enable/super 特权密码是否已配置；server 恒 false。
        container_runtime:
          $ref: '#/components/schemas/ContainerRuntime'
        host_key_fingerprint:
          type: string
          description: 空字符串表示尚未 TOFU 记录；Telnet 接入恒空串（无主机密钥语义）。
        host_key_verified_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ServerList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Server'
    ServerCreate:
      type: object
      required: [name, host, username, auth_method]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        device_kind:
          $ref: '#/components/schemas/DeviceKind'
          default: server
        os:
          $ref: '#/components/schemas/TargetOS'
          default: linux
        netdev_brand:
          anyOf:
            - $ref: '#/components/schemas/NetdevBrand'
            - type: string
              const: ''
          description: 仅 device_kind=network_device 时必填。
        access_proto:
          $ref: '#/components/schemas/AccessProto'
          default: ssh
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 22
        winrm_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 5985
        username:
          type: string
          minLength: 1
          maxLength: 100
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
          description: auth_method=password/password_ntlm/password_basic 时必填（NTLM/Basic 存入同一加密字段）；network_device 恒用 password 登录。
        private_key:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
        passphrase:
          type: string
          maxLength: 4096
          writeOnly: true
        enable_secret:
          type: string
          maxLength: 4096
          writeOnly: true
          description: 仅 network_device：enable/super 特权密码，可选（空=未配置；空串与缺省等价）。
        confirm_telnet_cleartext:
          type: boolean
          default: false
          writeOnly: true
          description: access_proto=telnet 时必须显式传 true（明文风险确认）；缺失/false 返回 400。
        tags:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 32
        auto_exec_enabled:
          type: boolean
          default: false
      allOf:
        - if:
            properties:
              device_kind:
                const: network_device
            required: [device_kind]
          then:
            required: [netdev_brand, password]
            properties:
              os:
                const: network
              auth_method:
                const: password
              private_key:
                const: ''
        - if:
            properties:
              device_kind:
                const: network_device
              access_proto:
                const: telnet
            required: [device_kind, access_proto]
          then:
            required: [confirm_telnet_cleartext]
            properties:
              confirm_telnet_cleartext:
                const: true
        - if:
            properties:
              os:
                const: linux
            required: [os]
          then:
            properties:
              auth_method:
                enum: [password, private_key]
        - if:
            properties:
              auth_method:
                const: password
            required: [auth_method]
          then:
            required: [password]
            not:
              required: [private_key]
        - if:
            properties:
              auth_method:
                const: password_ntlm
            required: [auth_method]
          then:
            required: [os]
            properties:
              os:
                const: windows
              password:
                minLength: 1
            not:
              required: [private_key]
        - if:
            properties:
              auth_method:
                const: password_basic
            required: [auth_method]
          then:
            required: [os]
            properties:
              os:
                const: windows
              password:
                minLength: 1
            not:
              required: [private_key]
        - if:
            properties:
              auth_method:
                const: private_key
            required: [auth_method]
          then:
            required: [private_key]
            not:
              required: [password]
    ServerUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        device_kind:
          $ref: '#/components/schemas/DeviceKind'
        os:
          $ref: '#/components/schemas/TargetOS'
        netdev_brand:
          anyOf:
            - $ref: '#/components/schemas/NetdevBrand'
            - type: string
              const: ''
        access_proto:
          $ref: '#/components/schemas/AccessProto'
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        winrm_port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
          minLength: 1
          maxLength: 100
        auth_method:
          $ref: '#/components/schemas/AuthMethod'
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        private_key:
          type: string
          minLength: 1
          maxLength: 65536
          writeOnly: true
        passphrase:
          type: string
          maxLength: 4096
          writeOnly: true
        enable_secret:
          type: string
          maxLength: 4096
          writeOnly: true
          description: 仅 network_device：提供即替换；空字符串表示清空 enable 密码。
        confirm_telnet_cleartext:
          type: boolean
          default: false
          writeOnly: true
          description: 更新使 access_proto 生效为 telnet 时必须显式传 true。
        tags:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 32
        auto_exec_enabled:
          type: boolean
      allOf:
        - if:
            properties:
              access_proto:
                const: telnet
            required: [access_proto]
          then:
            required: [confirm_telnet_cleartext]
            properties:
              confirm_telnet_cleartext:
                const: true
          description: 近似表达；跨请求终态组合（存量 telnet + 本次改密码）由服务端按契约 2.6 强制。
        - if:
            anyOf:
              - required: [password]
              - required: [private_key]
              - required: [passphrase]
          then:
            required: [auth_method]
        - if:
            required: [auth_method]
            properties:
              auth_method:
                const: password
          then:
            required: [password]
            not:
              required: [private_key]
        - if:
            required: [auth_method]
            properties:
              auth_method:
                enum: [password_ntlm, password_basic]
          then:
            required: [os, password]
            properties:
              os:
                const: windows
            not:
              required: [private_key]
        - if:
            required: [auth_method]
            properties:
              auth_method:
                const: private_key
          then:
            required: [private_key]
            not:
              required: [password]
    ServerTestResult:
      type: object
      required: [ok, latency_ms, fingerprint, first_seen, server_version]
      properties:
        ok:
          type: boolean
          const: true
        cleartext_warning:
          type: string
          description: Telnet 接入的网络设备返回明文风险告警（契约 2.6「UI 必须显示明文风险提示」）；其余通道不下发。
        latency_ms:
          type: integer
          minimum: 0
        fingerprint:
          type: string
          description: 形如 SHA256:...；Telnet 接入的网络设备恒空串（无主机密钥语义）。
        first_seen:
          type: boolean
          description: true 表示首次信任并已记录主机密钥。
        server_version:
          type: string

    Database:
      type: object
      required:
        - id
        - name
        - engine
        - host
        - port
        - database_name
        - username
        - sqlite_path
        - instance_name
        - redis_db
        - auth_db
        - ssl_mode
        - has_password
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        engine:
          $ref: '#/components/schemas/DatabaseEngine'
        host:
          type: string
        port:
          type: integer
          minimum: 0
          maximum: 65535
        database_name:
          type: string
          description: mssql/mongodb 必填；redis 固定空串（redis 用整数 redis_db）。
        username:
          type: string
          description: mssql 必填；mongodb 与 password 成对（同空=无认证）；redis 可空（Redis 6 ACL 用户，默认 default 可省略）。
        sqlite_path:
          type: string
        instance_name:
          type: string
          description: 仅 mssql：SQL Server 命名实例名；非空时 port 必须为 0（经 SQL Server Browser 解析），为空时 port 必填直连。其他 engine 固定空串。
        redis_db:
          type: integer
          minimum: 0
          maximum: 1023
          description: 仅 redis：逻辑库编号；其他 engine 固定 0。
        auth_db:
          type: string
          maxLength: 100
          description: 仅 mongodb：认证库（AuthSource）；空串表示驱动默认 admin。其他 engine 固定空串。
        ssl_mode:
          $ref: '#/components/schemas/SSLMode'
        has_password:
          type: boolean
          description: mssql 恒为 true；mongodb 表示是否配置了认证密码（与 username 成对）；redis 表示是否配置了 AUTH 密码。
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DatabaseList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Database'
    DatabaseCreate:
      type: object
      required: [name, engine]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        engine:
          $ref: '#/components/schemas/DatabaseEngine'
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 0
          maximum: 65535
        database_name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 4096
          writeOnly: true
          description: mssql 必填；mongodb 与 username 成对可选（无认证则都不提供）；redis 可选（requirepass/ACL 密码）；postgres/mysql 同一期。
        sqlite_path:
          type: string
          maxLength: 4096
          description: SQLite 绝对路径；必须以 / 开头，且服务端可读。
        instance_name:
          type: string
          maxLength: 100
          description: 仅 mssql；与 port 互斥（instance 非空时 port 必须为 0）。
        redis_db:
          type: integer
          minimum: 0
          maximum: 1023
        auth_db:
          type: string
          maxLength: 100
          description: 仅 mongodb：认证库（AuthSource）；缺省空串 = admin。
        ssl_mode:
          $ref: '#/components/schemas/SSLMode'
      allOf:
        - if:
            properties:
              engine:
                const: sqlite
            required: [engine]
          then:
            required: [sqlite_path]
            properties:
              host:
                const: ''
              port:
                const: 0
              database_name:
                const: ''
              username:
                const: ''
        - if:
            properties:
              engine:
                enum: [postgres, mysql]
            required: [engine]
          then:
            required: [host, port, database_name, username]
            properties:
              sqlite_path:
                const: ''
        - if:
            properties:
              engine:
                const: mssql
            required: [engine]
          then:
            required: [host, database_name, username, password]
            properties:
              sqlite_path:
                const: ''
        - if:
            properties:
              engine:
                const: redis
            required: [engine]
          then:
            required: [host, port]
            properties:
              database_name:
                const: ''
              sqlite_path:
                const: ''
        - if:
            properties:
              engine:
                const: mongodb
            required: [engine]
          then:
            required: [host, database_name]
            properties:
              port:
                default: 27017
                minimum: 1
                maximum: 65535
              sqlite_path:
                const: ''
              instance_name:
                const: ''
              redis_db:
                const: 0
    DatabaseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        host:
          type: string
          maxLength: 255
        port:
          type: integer
          minimum: 0
          maximum: 65535
        database_name:
          type: string
          maxLength: 255
        username:
          type: string
          maxLength: 100
        password:
          type: string
          maxLength: 4096
          writeOnly: true
          description: 提供时替换；空字符串表示清空密码。mongodb 与 username 成对（清空须两者同时清）。
        sqlite_path:
          type: string
          maxLength: 4096
        instance_name:
          type: string
          maxLength: 100
        redis_db:
          type: integer
          minimum: 0
          maximum: 1023
        auth_db:
          type: string
          maxLength: 100
