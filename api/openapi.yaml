    BatchResult:
      type: object
      required: [id, batch_job_id, server_id, server_name, risk_level, rule_id, approval_id, status, edited_command, exit_code, output, truncated, error_code, duration_ms, created_at, updated_at]
      additionalProperties: false
      properties:
