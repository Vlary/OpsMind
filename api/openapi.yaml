  /api/diagnosis/sessions/{id}/fix:
    post:
      tags: [diagnosis]
      operationId: diagnoseFix
      summary: 对报告建议发起修复（按统一审批门限分流）
      description: |
        command 必须逐字节等于 report.suggestions[].command 之一。六期起按统一
        审批门限（契约 2.11 约定 2）分流：NeedsApproval=true 时创建 source=console
        审批并返回 approval（execution=null），经 decide 批准后执行；false 时本端点
        同步执行并返回 execution（approval=null）。
      parameters:
        - $ref: '#/components/parameters/Origin'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              additionalProperties: false
              properties:
                command:
                  type: string
                  minLength: 1
                  maxLength: 16384
      responses:
        '200':
          description: 需审批时返回 approval（execution=null）；门限判定直执行时返回 execution（approval=null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisFixResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

