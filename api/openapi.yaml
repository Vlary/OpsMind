          format: int64
        distinct_rules:
          type: integer
          format: int64
        severity_timeline:
          type: array
          maxItems: 28
          items:
            $ref: '#/components/schemas/AlertSeverityBucket'
        top_rules:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/AlertRuleStat'

    AlertSeverityBucket:
      type: object
      required: [bucket_start, info, warning, critical]
      additionalProperties: false
      properties:
        bucket_start:
          type: string
          format: date-time
        info:
          type: integer
          format: int64
        warning:
          type: integer
          format: int64
        critical:
          type: integer
          format: int64

    AlertRuleStat:
      type: object
      required: [rule_id, rule_name, severity, count, server_count, last_fired_at]
      additionalProperties: false
      properties:
        rule_id:
          type: string
          format: uuid
        rule_name:
          type: string
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        count:
          type: integer
          format: int64
        server_count:
          type: integer
          format: int64
        last_fired_at:
          type: string
          format: date-time

    NotificationChannel:
      type: object
      required: [id, name, kind, config_hint, has_config, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          enum: [webhook, feishu, dingtalk, email]
        config_hint:
          type: string
        has_config:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationChannel'

    NotificationChannelCreate:
      type: object
      required: [name, kind, config]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          enum: [webhook, feishu, dingtalk, email]
        config:
          type: object
          description: 明文配置（schema 见 CONTRACT.md 5.15；按 kind 校验）；加密落库，响应永不回显。
          additionalProperties: true

    NotificationChannelUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          type: string
          enum: [webhook, feishu, dingtalk, email]
        config:
          type: object
          description: 留空表示不修改；提供即整体替换。
          additionalProperties: true

    NotifyTestResult:
      type: object
      required: [kind, ok, duration_ms]
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [webhook, feishu, dingtalk, email]
        ok:
          type: boolean
        error_code:
          type: string
        duration_ms:
          type: integer

    DiagnosisSession:
      type: object
      required: [id, alert_event_id, server_id, server_name, conversation_id, trigger, status, report, error_code, started_at, finished_at, expires_at, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        alert_event_id:
          type: integer
          format: int64
          nullable: true
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
        conversation_id:
          type: string
          format: uuid
          nullable: true
        trigger:
          type: string
          enum: [alert, manual, chat]
        status:
          type: string
          enum: [pending, diagnosing, report, awaiting_fix, done, expired, failed]
        report:
          allOf:
            - $ref: '#/components/schemas/DiagnosisReport'
          nullable: true
        error_code:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DiagnosisReport:
      type: object
      description: 诊断报告 schema（CONTRACT.md 5.16 写死）。
      required: [summary, severity, root_cause, evidence, suggestions, confidence]
      additionalProperties: false
      properties:
        summary:
          type: string
          maxLength: 2048
        severity:
          type: string
          enum: [info, warning, critical]
        root_cause:
          type: string
          maxLength: 8192
        evidence:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/DiagnosisEvidence'
        suggestions:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/FixSuggestion'
        confidence:
          type: string
          enum: [low, medium, high]

    DiagnosisEvidence:
      type: object
      required: [source, output_excerpt, note]
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [command, metric, alert, log]
        command:
          type: string
        output_excerpt:
          type: string
          maxLength: 4096
        note:
          type: string

    FixSuggestion:
      type: object
      required: [command, reason, risk_level]
      additionalProperties: false
      properties:
        command:
          type: string
          minLength: 1
          maxLength: 16384
        reason:
          type: string
        risk_level:
          type: string
          enum: [safe, needs_approval]

    DiagnosisSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosisSession'

    InspectionJob:
      type: object
      required: [id, name, cron, target_tags, template, notify_enabled, notify_channel_id, enabled, last_run_at, next_run_at, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        cron:
          type: string
          description: 五段标准 cron（分 时 日 月 周），UTC。
        target_tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 32
          maxItems: 16
        template:
          type: string
          enum: [basic, full]
        notify_enabled:
          type: boolean
        notify_channel_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
        last_run_at:
          type: string
          format: date-time
          nullable: true
        next_run_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InspectionJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InspectionJob'

    InspectionJobCreate:
      type: object
      required: [name, cron]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        cron:
          type: string
        target_tags:
          type: array
          items:
            type: string
          maxItems: 16
          default: []
        template:
          type: string
          enum: [basic, full]
          default: basic
        notify_enabled:
          type: boolean
          default: false
        notify_channel_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
          default: true

    InspectionJobUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        cron:
          type: string
        target_tags:
          type: array
          items:
            type: string
          maxItems: 16
        template:
          type: string
          enum: [basic, full]
        notify_enabled:
          type: boolean
        notify_channel_id:
          type: string
          format: uuid
          nullable: true
        clear_notify_channel:
          type: boolean
        enabled:
          type: boolean

    InspectionReport:
      type: object
      required: [id, job_id, job_name, trigger, server_count, avg_score, anomaly_count, started_at, finished_at, created_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
          nullable: true
        job_name:
          type: string
        trigger:
          type: string
          enum: [cron, manual, chat]
        server_count:
          type: integer
          minimum: 0
        avg_score:
          type: integer
          minimum: 0
          maximum: 100
        anomaly_count:
          type: integer
          minimum: 0
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    InspectionReportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/InspectionReport'

    InspectionTrend:
      type: object
      required: [job_id, points, truncated]
      additionalProperties: false
      properties:
        job_id:
          type: string
          format: uuid
          nullable: true
          description: 回显请求的 job_id；缺省为 null（全部报告，含即时巡检）。
        points:
          type: array
          maxItems: 60
          items:
            $ref: '#/components/schemas/InspectionTrendPoint'
        truncated:
          type: boolean
          description: true=还有更早的报告（按报告份数截断，不是时间窗截断）。

    InspectionTrendPoint:
      type: object
      required: [report_id, created_at, avg_score, server_count, anomaly_count, trigger]
      additionalProperties: false
      properties:
        report_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        avg_score:
          type: integer
          minimum: 0
          maximum: 100
        server_count:
          type: integer
          minimum: 0
        anomaly_count:
          type: integer
          minimum: 0
        trigger:
          type: string
          enum: [cron, manual, chat]

    InspectionAnomaly:
      type: object
      required: [item, detail, severity]
      additionalProperties: false
      properties:
        item:
          type: string
          enum: [collect, service, disk, load, memory, journal]
        detail:
          type: string
        severity:
          type: string
          enum: [info, warning, critical]

    InspectionReportItem:
      type: object
      required: [id, report_id, server_id, server_name, score, anomaly_count, anomalies, raw_output, command, truncated, duration_ms, error_code, created_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        report_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        anomaly_count:
          type: integer
          minimum: 0
        anomalies:
          type: array
          items:
            $ref: '#/components/schemas/InspectionAnomaly'
        raw_output:
          type: string
        command:
          type: string
          maxLength: 4096
          description: |
            模板展开后实际执行的命令清单（换行分隔，按执行顺序；六期打磨 sprint 1，
            inspection_report_items.command，迁移 00011）。报告抽屉「命令」列据此
            提供复制入口（契约 8.7 ⑧）；空串 = 00011 之前的旧行未记录。
        truncated:
          type: boolean
        duration_ms:
          type: integer
        error_code:
          type: string
        created_at:
          type: string
          format: date-time

    InspectionReportDetail:
      type: object
      required: [report, items, previous_scores]
      additionalProperties: false
      properties:
        report:
          $ref: '#/components/schemas/InspectionReport'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/InspectionReportItem'
        previous_scores:
          type: object
          nullable: true
          description: 同 job 上一份报告的 server_id → score（趋势对比）；即时巡检为 null。
          additionalProperties:
            type: integer

    BatchJobCreate:
      type: object
      required: [command, server_ids]
      additionalProperties: false
      properties:
        description:
          type: string
          maxLength: 2000
          description: 自然语言意图原文。
        command:
          type: string
          minLength: 1
          maxLength: 16384
        server_ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid

    BatchJob:
      type: object
      required: [id, description, command, server_ids, source, conversation_id, status, total_count, done_count, finished_at, created_by, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        command:
          type: string
        server_ids:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            format: uuid
        source:
          type: string
          enum: [console, chat]
        conversation_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, running, partial, done, failed, cancelled]
        total_count:
          type: integer
          minimum: 1
        done_count:
          type: integer
          minimum: 0
        finished_at:
          type: string
          format: date-time
          nullable: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BatchJobList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchJob'

    BatchResult:
      type: object
      required: [id, batch_job_id, server_id, server_name, risk_level, rule_id, approval_id, status, edited_command, exit_code, output, truncated, error_code, duration_ms, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        batch_job_id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
        risk_level:
          type: string
          enum: [safe, needs_approval, forbidden]
        rule_id:
          type: string
        approval_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [pending, awaiting_approval, executed, failed, denied, expired, skipped, cancelled]
        edited_command:
          type: string
          description: >-
            该台审批的用户改写命令（六期打磨 sprint 5；approval.edited_command
            的关联读值）。空串=未改写或无审批（safe 直执行）。批量详情「命令」列
            据此显示「实际执行：<改写命令>」。
        exit_code:
          type: integer
          nullable: true
        output:
          type: string
        truncated:
          type: boolean
        error_code:
          type: string
        duration_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BatchJobDetail:
      type: object
      required: [job, results]
      additionalProperties: false
      properties:
        job:
          $ref: '#/components/schemas/BatchJob'
        results:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/BatchResult'
