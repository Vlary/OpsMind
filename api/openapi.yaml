        truncated:
          type: boolean
        error_code:
          type: string
        duration_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BatchJobDetail:
      type: object
      required: [job, results]
