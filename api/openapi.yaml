            - type: 'null'
        execution:
          oneOf:
            - $ref: '#/components/schemas/ApprovalExecution'
            - type: 'null'
    SettingsResponse:
      type: object
      required: [approval_mode]
      additionalProperties: false
      properties:
        approval_mode:
          $ref: '#/components/schemas/ApprovalMode'
          description: 全局审批门限（settings['approval.mode']；键缺失兜底 standard）。
        single_admin_degraded:
          type: boolean
          description: |
            只读降级态：可承担第二人职责的启用账号（admin/approver）<= 1 时为 true。
            此时审批批准、终端/RDP 授权与会话、policy 放宽都会被拒（409
            NO_SECOND_APPROVER）。前端据此在点按钮前渲染中文说明并置灰按钮。
            与启动告警 rbac_single_admin_warning 同一判定口径（CountEnabledApprovers）。
            存储不可用时本字段缺省（未知状态，前端不得据此隐藏按钮）。
        enabled_approvers:
          type: integer
          description: 只读：当前启用且可审批的账号数（admin + approver），用于降级说明文案。
    SettingsUpdate:
