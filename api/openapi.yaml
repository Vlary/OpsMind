          oneOf:
            - $ref: '#/components/schemas/ApprovalExecution'
            - type: 'null'
          description: 仅 source=console|batch 且批准时非 null（四期容器/五期批量同步执行结果；执行命令为 edited_command 非空时的改写后命令）；chat 审批与拒绝/过期恒 null。
    DiagnosisFixResult:
      type: object
      required: [approval, execution]
      description: 六期起诊断 fix 统一 wrapper：需审批时 approval 非 null（execution=null）；门限判定直执行时 execution 非 null（approval=null）。五期裸 Approval 形态废弃。
      properties:
        approval:
          oneOf:
            - $ref: '#/components/schemas/Approval'
            - type: 'null'
        execution:
          oneOf:
            - $ref: '#/components/schemas/ApprovalExecution'
            - type: 'null'
    SettingsResponse:
      type: object
      required: [approval_mode]
      additionalProperties: false
      properties:
        approval_mode:
          $ref: '#/components/schemas/ApprovalMode'
          description: 全局审批门限（settings['approval.mode']；键缺失兜底 standard）。
    SettingsUpdate:
      type: object
      required: [approval_mode]
      additionalProperties: false
      properties:
