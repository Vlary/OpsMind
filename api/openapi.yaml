  /api/conversations/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [conversations]
      operationId: conversationReplay
      summary: 会话执行回放（六期；八期扩展）
      description: |
        从持久化表（messages / tool_calls / approvals）重建会话的有序事件序列，
        用于回放播放器。排序写死：timestamp ASC；同 timestamp 按 kind 权重
        user_message(0) → tool_call(1) → approval(2) → execution(3) →
        reasoning(4) → assistant_text(5)，同权重内按来源 seq/id 升序；
        输出统一重编 seq=1..N（契约 2.11 约定 4）。
        步数上限 20000：超出丢弃最旧步骤并置顶层 truncated=true（11 节）。
        另有一处独立截断：单状态审批满 200 条（approvals.List 无游标）时更早
        审批不纳入回放。两种来源的 truncated 均为 true，具体原因见
        truncated_reason（`steps` / `approvals`；未截断为空串）。
        **八期（契约 2.12 约定 3 / 7.8）**：`execution` 步从 2 个命令执行工具
        扩到 11 个动作类工具（ssh_exec / server_facts / container_action /
        container_list / container_inspect / container_logs / image_list /
        db_query / batch_execute / run_diagnosis / run_inspection）；全部 18 个
        工具的 tool_call 步与 11 个动作类工具的 execution 步都带 `result_summary`；execution 步新增
        `affected_servers` / `result_truncated` / `diagnosis_id` /
        `inspection_report_id` / `batch_job_id`，`command` 对非命令类工具
        承载动作串（UI 标注为「动作」）。新增第三道截断：`arguments` 装载
        总量超 6 MiB 或响应序列化超 8 MiB 时 `truncated_reason='payload'`
        （优先级 steps > payload > approvals，只报最高者）。
        权限与 GET /api/conversations/{id}/messages 相同（登录态；owner 或 audit:read 只读；其他用户 404）。
      responses:
        '200':
          description: 有序回放步骤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/replays:
    get:
      tags: [conversations]
      operationId: listReplays
      summary: 回放目录（八期）
      description: |
        返回「可回放会话」的摘要页，供独立回放页（`/replays`）左栏目录使用
        （契约 2.12 约定 4 / 5.19.1）。每行的计数由 `tool_calls` / `approvals`
        聚合派生，**不由前端拼装**——前端聚合需要为每个会话各取一次
        `GET /api/conversations/{id}/replay`（20000 步 / 8 MiB），不可接受。
        排序 `last_message_at DESC, id DESC`；游标分页与 `GET /api/conversations`
        同构（`before_last_message_at` + `before_id` 必须成对）。
        `q` 按标题大小写不敏感子串匹配（`%`/`_`/`\` 转义）；
        `has_actions=true` 只返回至少有一个动作类工具调用（12 工具，契约 7.8）
        的会话。`truncated` 为该行步数上限预判（`tool_count + approval_count
        > 20000`），不预判 payload 预算。
        权限同 GET /api/conversations（登录态；非 audit:read 按 user_id 过滤，audit:read 全量只读）。
      parameters:
        - name: q
          in: query
          description: 标题子串过滤（大小写不敏感），1..200 字符；空/缺省=不过滤。
          schema:
            type: string
            maxLength: 200
        - name: has_actions
          in: query
          description: true 时只返回含动作类工具调用的会话；缺省 false=不过滤。
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: 每页数量，缺省 50。
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: before_last_message_at
          in: query
          description: 上一页末行的 last_message_at（RFC3339）；必须与 before_id 成对出现。
          schema:
            type: string
            format: date-time
        - name: before_id
          in: query
          description: 上一页末行的会话 ID；必须与 before_last_message_at 成对出现。
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 回放目录页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayCatalogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/chat:
    post:
      tags: [chat]
      operationId: chat
      summary: 发送消息并流式接收回答
      description: |
        成功返回 `text/event-stream`。响应不压缩，`X-Accel-Buffering: no`，每事件立即 flush，15s 心跳。
        进入 SSE 前的错误（无供应商、会话不存在、已有活跃流等）返回普通 JSON 错误。
        进入 SSE 后错误只通过 `event: error` 发送，HTTP 状态保持 200。SSE 不自动重连。
        必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: 'SSE 流。`done` 与 `error` 互斥且为最后一个事件；心跳为 `: ping`。'
          headers:
            X-Accel-Buffering:
              description: 固定 `no`
              schema:
                type: string
                const: 'no'
            Cache-Control:
              description: 固定 `no-cache, no-transform`
              schema:
                type: string
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE 帧，事件 schema 见 x-sse-events
          x-sse-events:
            heartbeat:
              format: ': ping\n\n'
              description: 连续 15s 无事件时发送
            token:
              schema:
                $ref: '#/components/schemas/SseToken'
            reasoning:
              schema:
                $ref: '#/components/schemas/SseReasoning'
            tool_call:
              schema:
                $ref: '#/components/schemas/SseToolCall'
            tool_result:
              schema:
                $ref: '#/components/schemas/SseToolResult'
            approval_required:
              schema:
                $ref: '#/components/schemas/Approval'
            approval_resolved:
              schema:
                $ref: '#/components/schemas/SseApprovalResolved'
            done:
              schema:
                $ref: '#/components/schemas/SseDone'
            error:
              schema:
                $ref: '#/components/schemas/SseError'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/OriginForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 会话已有活跃流，或会话已绑定其他供应商/模型
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 未配置供应商
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NO_PROVIDER_CONFIGURED
                  message: no LLM provider is configured
                  request_id: 0123456789abcdef
        '429':
          description: 全局流并发达到上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

