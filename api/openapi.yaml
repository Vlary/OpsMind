    SessionEndReason:
      type: string
      enum: ['', client_closed, idle_timeout, max_duration, server_shutdown, error]

    TerminalGrantCreate:
      type: object
      required: [server_id]
      additionalProperties: false
      properties:
        server_id:
          type: string
          format: uuid
    TerminalGrantCreated:
      type: object
      required: [approval, grant]
      properties:
        approval:
          $ref: '#/components/schemas/Approval'
        grant:
          type: object
          required: [approval_id, grant_kind, server_id, grant_expires_at]
          properties:
            approval_id:
              type: string
              format: uuid
            grant_kind:
              type: string
              enum: [term, rdp]
            server_id:
              type: string
              format: uuid
            grant_expires_at:
              type: string
              format: date-time
    TerminalGrantList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Approval'
        count:
          type: integer
          minimum: 0
          description: 本次返回的可用授权条数（与 items 长度一致，便于页面直接展示「N 条」）。

    TerminalSessionCreate:
      type: object
      required: [server_id]
      additionalProperties: false
      properties:
        server_id:
          type: string
          format: uuid
        grant_id:
          type: string
          format: uuid
          description: |
            已批准、未消费的 source=terminal/grant_kind=term 审批 id（00012）。
            省略/空串表示消费该用户在该服务器上最新一条已批准 grant；没有
            可消费 grant 返回 403 TERMINAL_APPROVAL_REQUIRED（仍要求他人批准
            与单次消费）。
        cols:
          type: integer
          minimum: 10
          maximum: 500
          default: 120
        rows:
          type: integer
          minimum: 4
          maximum: 200
          default: 40
    TerminalSessionCreated:
      type: object
      required: [session, ws_url]
      properties:
        session:
          $ref: '#/components/schemas/TerminalSession'
        ws_url:
          type: string
          description: '相对路径 /api/term/sessions/{id}/ws；客户端带子协议 opsmind-term-v1 发起升级。'
    TerminalSession:
      type: object
      required:
        - id
        - server_id
        - server_name
        - os
        - username
        - status
        - cols
        - rows
        - ended_reason
        - has_recording
        - bytes_written
        - started_at
        - last_activity_at
        - ended_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
          description: 由 servers.name JOIN 填充；服务器删除后为空串。
        os:
          $ref: '#/components/schemas/TargetOS'
        username:
          type: string
          description: 发起终端的用户（users.username；RBAC 后随实际发起人，不再恒为 admin）。
        status:
          $ref: '#/components/schemas/InteractiveSessionStatus'
        cols:
          type: integer
          minimum: 10
          maximum: 500
        rows:
          type: integer
          minimum: 4
          maximum: 200
        ended_reason:
          $ref: '#/components/schemas/SessionEndReason'
        has_recording:
          type: boolean
        bytes_written:
          type: integer
          format: int64
          minimum: 0
          description: 录制文件累计字节数。
        started_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TerminalSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TerminalSession'

    TermFrameInput:
      type: object
      description: 客户端 → 服务端；data 为终端原始输入字节的 base64（StdEncoding）。
      required: [type, data]
      additionalProperties: false
      properties:
        type:
          type: string
          const: input
        data:
          type: string
          maxLength: 10928
          description: base64(≤8KB 原始字节)；单帧超限断开（error invalid_frame）。
    TermFrameResize:
      type: object
      required: [type, cols, rows]
      additionalProperties: false
      properties:
        type:
          type: string
          const: resize
        cols:
          type: integer
          minimum: 10
          maximum: 500
        rows:
          type: integer
          minimum: 4
          maximum: 200
    TermFrameOutput:
      type: object
      description: 服务端 → 客户端；data 为 PTY 输出原始字节的 base64；同时写入 .cast 的 o 事件。
      required: [type, data]
      properties:
        type:
          type: string
          const: output
        data:
          type: string
    TermFrameResized:
      type: object
      description: resize 实际生效后的确认帧（cols/rows 为远端 PTY 最终值）；同时写入 .cast 的 r 事件。
      required: [type, cols, rows]
      properties:
        type:
          type: string
          const: resized
        cols:
          type: integer
        rows:
          type: integer
    TermFrameError:
      type: object
      required: [type, code, message]
      properties:
        type:
          type: string
          const: error
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
    TermFrameClosed:
      type: object
      description: 服务端最后一帧；发送后关闭连接。终端输入摘要此时已审计。
      required: [type, reason]
      properties:
        type:
          type: string
          const: closed
        reason:
          type: string
          enum: [client_closed, idle_timeout, max_duration, server_shutdown, error]

    TerminalRecording:
      type: object
      required:
        - id
        - server_id
        - server_name
        - os
        - username
        - bytes_written
        - started_at
        - ended_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: 终端会话 ID；下载路径 /api/term/recordings/{id}。
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
        os:
          $ref: '#/components/schemas/TargetOS'
        username:
          type: string
        bytes_written:
          type: integer
          format: int64
          minimum: 0
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    TerminalRecordingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TerminalRecording'

    RdpSessionCreate:
      type: object
      required: [server_id]
      additionalProperties: false
      properties:
        server_id:
          type: string
          format: uuid
        grant_id:
          type: string
          format: uuid
          description: |
            已批准、未消费的 source=terminal/grant_kind=rdp 审批 id（00012）；
            省略/空串消费最新一条已批准 grant。
        width:
          type: integer
          minimum: 640
          maximum: 3840
          default: 1280
        height:
          type: integer
          minimum: 480
          maximum: 2160
          default: 800
        dpi:
          type: integer
          minimum: 72
          maximum: 120
          default: 96
    RdpSessionCreated:
      type: object
      required: [session, ws_url]
      properties:
        session:
          $ref: '#/components/schemas/RdpSession'
        ws_url:
          type: string
          description: '相对路径 /api/rdp/sessions/{id}/ws；无子协议，直接交 guacamole-common-js 的 WebSocketTunnel。'
    RdpSession:
      type: object
      required:
        - id
        - server_id
        - server_name
        - width
        - height
        - dpi
        - status
        - ended_reason
        - has_recording
        - bytes_written
        - started_at
        - last_activity_at
        - ended_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
        width:
          type: integer
        height:
          type: integer
        dpi:
          type: integer
        status:
          $ref: '#/components/schemas/InteractiveSessionStatus'
        ended_reason:
          $ref: '#/components/schemas/SessionEndReason'
        has_recording:
          type: boolean
        bytes_written:
          type: integer
          format: int64
          minimum: 0
          description: guacd 侧 .guac 文件的近似字节数（会话结束时 stat 一次）。
        started_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RdpSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RdpSession'

    RdpRecording:
      type: object
      required:
        - id
        - server_id
        - server_name
        - bytes_written
        - started_at
        - ended_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: RDP 会话 ID；下载路径 /api/rdp/recordings/{id}。
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
        bytes_written:
          type: integer
          format: int64
          minimum: 0
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    RdpRecordingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RdpRecording'

    # ---------- 五期（M1/M2/M3）----------

    MetricPoint:
      type: object
      required: [created_at, cpu_pct, mem_pct, disk_pct, load_1, net_in_bps, net_out_bps]
      additionalProperties: false
      properties:
        created_at:
          type: string
          format: date-time
        cpu_pct:
          type: number
          minimum: 0
          maximum: 100
        mem_pct:
          type: number
          minimum: 0
          maximum: 100
        disk_pct:
          type: number
          minimum: 0
          maximum: 100
        load_1:
          type: number
          minimum: 0
        net_in_bps:
          type: integer
          format: int64
          minimum: 0
        net_out_bps:
          type: integer
          format: int64
          minimum: 0

    MetricSeries:
      type: object
      required: [server_id, minutes, points, truncated]
      additionalProperties: false
      properties:
        server_id:
          type: string
          format: uuid
        minutes:
          type: integer
        points:
          type: array
          maxItems: 2880
          items:
            $ref: '#/components/schemas/MetricPoint'
        truncated:
          type: boolean
          description: >-
            true 表示窗口内还有更早的点因 2880 点上限（30s 最小采集间隔 ×
            24h）未返回；仅表示返回集合被截断，不代表更早时段无采样。

    CollectorConfig:
      type: object
      required: [enabled, interval_seconds]
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        interval_seconds:
          type: integer
          minimum: 30
          maximum: 3600

    MonitorOverview:
      type: object
      required: [servers, firing, server_time, last_inspection, collector]
      additionalProperties: false
      properties:
        server_time:
          type: string
          format: date-time
          description: >-
            本响应生成时的服务端时间；前端用它校正浏览器时钟偏差，所有
            「N 前/过期」与未来样本判定均按此时间计算。
        servers:
          type: array
          items:
            $ref: '#/components/schemas/MetricLatestRow'
        firing:
          type: object
          required: [info, warning, critical, total]
          properties:
            info:
              type: integer
            warning:
              type: integer
            critical:
              type: integer
            total:
              type: integer
        last_inspection:
          type: object
          nullable: true
          properties:
            report_id:
              type: string
              format: uuid
            avg_score:
              type: integer
              minimum: 0
              maximum: 100
            created_at:
              type: string
              format: date-time
        collector:
          $ref: '#/components/schemas/CollectorConfig'

    MonitorTrend:
      type: object
      required: [window, bucket_seconds, from, to, first_sample, last_sample, points]
      additionalProperties: false
      properties:
        window:
          type: string
          enum: [24h, 7d]
        bucket_seconds:
          type: integer
          enum: [3600, 21600]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        first_sample:
          type: string
          format: date-time
          nullable: true
          description: 窗口内实际参与聚合的最早采样时刻（已按服务端 now 钳制）；无样本时为 null。
        last_sample:
          type: string
          format: date-time
          nullable: true
          description: 窗口内实际参与聚合的最晚采样时刻（已按服务端 now 钳制）；无样本时为 null。前端用 last_sample - first_sample 展示真实数据跨度，避免把未满桶的桶跨度说成数据跨度。
        points:
          type: array
          maxItems: 28
          items:
            $ref: '#/components/schemas/MetricTrendPoint'

    MetricTrendPoint:
      type: object
      description: 一个时间桶；无样本桶的六个指标字段为 null（前端断线不连点）。
      required: [bucket_start, cpu_p95, cpu_avg, cpu_max, mem_p95, mem_avg, mem_max, servers, samples]
      additionalProperties: false
      properties:
        bucket_start:
          type: string
          format: date-time
        cpu_p95:
          type: number
          nullable: true
        cpu_avg:
          type: number
          nullable: true
        cpu_max:
          type: number
          nullable: true
        mem_p95:
          type: number
          nullable: true
        mem_avg:
          type: number
          nullable: true
        mem_max:
          type: number
          nullable: true
        servers:
          type: integer
          description: 桶内覆盖的不同服务器数（count(DISTINCT server_id)）。
        samples:
          type: integer
          format: int64
          description: 桶内样本数（count(*)）。

    MetricLatestRow:
      type: object
      required: [server_id, server_name, os, created_at, cpu_pct, mem_pct, disk_pct, load_1, net_in_bps, net_out_bps]
      additionalProperties: false
      properties:
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
        os:
          allOf:
            - $ref: '#/components/schemas/TargetOS'
          description: >-
            资产平台（JOIN servers.os）。前端按它切换指标副文案：Linux 为
            /proc 与 loadavg 口径；Windows 为 Win32_Processor
            LoadPercentage / Win32_OperatingSystem / ProcessorQueueLength
            口径。缺失时前端使用平台中性文案。
        created_at:
          type: string
          format: date-time
        cpu_pct:
          type: number
        mem_pct:
          type: number
        disk_pct:
          type: number
        load_1:
          type: number
        net_in_bps:
          type: integer
          format: int64
        net_out_bps:
          type: integer
          format: int64

    AlertSeverity:
      type: string
      enum: [info, warning, critical]

    AlertMetricName:
      type: string
      enum: [cpu_pct, mem_pct, disk_pct, load_1, net_in_bps, net_out_bps]

    AlertRule:
      type: object
      required: [id, name, metric, comparator, threshold, duration_windows, cooldown_seconds, severity, silent_until, notify_channel_id, enabled, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        metric:
          $ref: '#/components/schemas/AlertMetricName'
        comparator:
          type: string
          enum: [gt, lt]
        threshold:
          type: number
          minimum: 0
        duration_windows:
          type: integer
          minimum: 1
          maximum: 30
        cooldown_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        silent_until:
          type: string
          format: date-time
          nullable: true
        notify_channel_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertRule'

    AlertRuleCreate:
      type: object
      required: [name, metric, comparator, threshold]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        metric:
          $ref: '#/components/schemas/AlertMetricName'
        comparator:
          type: string
          enum: [gt, lt]
        threshold:
          type: number
          minimum: 0
        duration_windows:
          type: integer
          minimum: 1
          maximum: 30
          default: 3
        cooldown_seconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 300
        severity:
          allOf:
            - $ref: '#/components/schemas/AlertSeverity'
          default: warning
        silent_until:
          type: string
          format: date-time
          nullable: true
        notify_channel_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
          default: true

    AlertRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        metric:
          $ref: '#/components/schemas/AlertMetricName'
        comparator:
          type: string
          enum: [gt, lt]
        threshold:
          type: number
          minimum: 0
        duration_windows:
          type: integer
          minimum: 1
          maximum: 30
        cooldown_seconds:
          type: integer
          minimum: 60
          maximum: 86400
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        silent_until:
          type: string
          format: date-time
          nullable: true
        clear_silent_until:
          type: boolean
        notify_channel_id:
          type: string
          format: uuid
          nullable: true
        clear_notify_channel:
          type: boolean
        enabled:
          type: boolean

    AlertEvent:
      type: object
      required: [id, rule_id, rule_name, server_id, server_name, metric, status, severity, value, message, fired_at, resolved_at, last_notified_at, notify_status, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
        rule_id:
          type: string
          format: uuid
        rule_name:
          type: string
        server_id:
          type: string
          format: uuid
        server_name:
          type: string
        metric:
          $ref: '#/components/schemas/AlertMetricName'
        status:
          type: string
          enum: [firing, resolved]
        severity:
          $ref: '#/components/schemas/AlertSeverity'
        value:
          type: number
        message:
          type: string
        fired_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        last_notified_at:
          type: string
          format: date-time
          nullable: true
        notify_status:
          type: string
          enum: [none, pending, sent, failed, skipped]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AlertEventList:
      type: object
      required: [items, has_more, next_before_id]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertEvent'
        has_more:
          type: boolean
        next_before_id:
          type: integer
          format: int64
          nullable: true

    AlertEventStats:
      type: object
      required: [window, bucket_seconds, from, to, server_time, total, distinct_rules, severity_timeline, top_rules]
      additionalProperties: false
      properties:
        window:
          type: string
          enum: [24h, 7d]
        bucket_seconds:
          type: integer
          enum: [3600, 21600]
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
          description: >-
            本响应生成时的服务端时间；to 对齐到当前桶结束，to > server_time
