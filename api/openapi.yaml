      tags: [alerts]
      operationId: getAlertEventStats
      summary: 告警事件图表统计
      description: |
        两条独立 SQL：① 按 fired_at 的 date_bin 时间桶 + count(*) FILTER 分级
        （空桶在服务端补零，时间轴连续）；② 按 rule 聚合 ORDER BY count DESC
        LIMIT top_rules。窗口与桶宽同 GET /api/monitor/trend。
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [24h, 7d]
            default: 24h
        - name: top_rules
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 8
      responses:
        '200':
          description: 统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertEventStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

