        六期起 body 携带 `title` 与/或 `approval_mode`（至少一项）。
        `approval_mode` 为 null 表示清除会话覆盖、回到跟随全局门限（契约 2.11 约定 1）。
        必须携带 Origin。
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
