        output:
          type: string
        truncated:
          type: boolean
        duration_ms:
          type: integer
          minimum: 0
        error_code:
          type: string
          description: 通道/执行失败时的错误码（如 SSH_EXEC_FAILED）；成功时缺省。
    ApprovalDecisionResult:
      type: object
      required: [approval, execution]
      properties:
        approval:
          $ref: '#/components/schemas/Approval'
        execution:
          oneOf:
            - $ref: '#/components/schemas/ApprovalExecution'
            - type: 'null'
          description: 仅 source=console|batch 且批准时非 null（四期容器/五期批量同步执行结果；执行命令恒为 approval.command——00012 起 edited_command 仅历史只读，永不参与执行）；chat 审批与拒绝/过期恒 null。
    DiagnosisFixResult:
      type: object
      required: [approval, execution]
      description: 六期起诊断 fix 统一 wrapper：需审批时 approval 非 null（execution=null）；门限判定直执行时 execution 非 null（approval=null）。五期裸 Approval 形态废弃。
      properties:
